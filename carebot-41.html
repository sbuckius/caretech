<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>✦ CAREtech · 41 · The Skill Overlap</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--hot:#ff2d6b;--candy:#ff85b3;--cream:#fff5f8;--maroon:#6f001e;--bg:#1a0012;--c:#c084fc;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--cream);font-family:'Quicksand',sans-serif;font-weight:600;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;overflow:hidden;}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 10% 15%,rgba(80,0,80,.35) 0%,transparent 55%),radial-gradient(ellipse 60% 70% at 90% 85%,rgba(120,0,30,.35) 0%,transparent 55%),linear-gradient(160deg,#160010,#100008 45%,#0e0012);}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(70px);will-change:transform;}
.o1{width:500px;height:500px;background:#3b0040;opacity:.22;top:-120px;left:-100px;animation:d1 20s ease-in-out infinite;}
.o2{width:400px;height:400px;background:#6f001e;opacity:.18;bottom:-80px;right:-80px;animation:d2 24s ease-in-out infinite;}
.o3{width:260px;height:260px;background:#ffd060;opacity:.06;top:40%;left:50%;animation:d3 17s ease-in-out infinite;}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,35px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}33%{transform:translate(-25px,18px)}66%{transform:translate(18px,-12px)}}
#c{position:fixed;inset:0;z-index:10;touch-action:none;display:block;width:100%;height:100%;}
.back{position:fixed;top:14px;left:18px;z-index:100;font-family:'Nunito',sans-serif;font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,180,210,.5);text-decoration:none;padding:6px 14px;border-radius:999px;background:rgba(10,0,6,.6);border:1px solid rgba(255,60,120,.2);transition:all .2s;}
.back:hover{color:var(--cream);border-color:var(--hot);background:rgba(255,45,107,.15);}
.nav{position:fixed;top:14px;right:18px;z-index:100;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:60vw;}
.chip{padding:5px 13px;border-radius:999px;background:rgba(255,45,107,.08);border:1px solid rgba(255,130,180,.2);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,200,224,.55);font-family:'Quicksand',sans-serif;font-weight:600;}
.chip-c{background:rgba(192,132,252,.12);border-color:var(--c);color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;}
.obj-tag{position:fixed;top:52px;right:18px;z-index:100;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,130,180,.32);}
.actions{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:10px;}
.btn{font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;letter-spacing:.10em;text-transform:uppercase;text-decoration:none;padding:10px 28px;border-radius:999px;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;}
.btn-hit{background:linear-gradient(135deg,#ff2d6b,#c4005a);color:#fff5f8;border:1.5px solid rgba(255,100,150,.9);box-shadow:0 4px 20px rgba(255,45,107,.5);}
.btn-hit:hover{box-shadow:0 6px 28px rgba(255,45,107,.75);transform:translateY(-2px) scale(1.04);}
.btn-bot{background:rgba(192,132,252,.14);color:#e0c0ff;border:1.5px solid rgba(192,132,252,.55);}
.btn-bot:hover{background:rgba(192,132,252,.28);color:#fff5f8;border-color:#c084fc;transform:translateY(-2px) scale(1.04);}
.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,160,200,.2);pointer-events:none;z-index:20;white-space:nowrap;}
</style>
</head>
<body>
<div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<a class="back" href="index.html">← All Carebots</a>
<div class="nav"><div class="chip">carebot-41</div><div class="chip chip-c">The Skill Overlap</div></div>
<div class="obj-tag">with: chair</div>
<canvas id="c"></canvas>
<div class="actions">
  <a class="btn btn-hit" href="carebot41-hit.html" target="_blank" rel="noopener">✦ HIT →</a>
  <a class="btn btn-bot" href="carebot41-bot.html" target="_blank" rel="noopener">◎ BOT →</a>
</div>
<div class="hint" id="hint">drag to orbit · scroll to zoom</div>
<script>
// CB41 tile color — purple/teal to match the Venn diagram theme
const TILE_COLOR = 0xc084fc;
const BOT_IDX = 40;
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
if(isMobile) document.getElementById('hint').textContent = 'drag to orbit · pinch to zoom';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:!isMobile, alpha:true, powerPreference:'high-performance'});
renderer.setClearColor(0,0); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

const scene = new THREE.Scene(), botScene = new THREE.Scene();
botScene.add(new THREE.AmbientLight(0x1a0a30, 2.5));
const bSun = new THREE.DirectionalLight(0xe0c0ff, 2.2); bSun.position.set(6,18,10); botScene.add(bSun);
const bRim = new THREE.DirectionalLight(0xff2d6b, 1.2); bRim.position.set(-10,6,-8); botScene.add(bRim);
const bGold = new THREE.DirectionalLight(0xffd060, 0.8); bGold.position.set(0,8,12); botScene.add(bGold);

const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 100);
camera.position.set(0, 4, isMobile ? 11 : 9.5); camera.lookAt(0, 1, 0);

function resize(){var W=canvas.clientWidth,H=canvas.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
resize(); window.addEventListener('resize', resize);

scene.add(new THREE.AmbientLight(0x1a0a30, 2.5));
var sun = new THREE.DirectionalLight(0xe0c0ff, 2.2); sun.position.set(6,18,10); scene.add(sun);
scene.add(new THREE.DirectionalLight(0xff2d6b, 1.2)).position.set(-10,6,-8);
scene.add(new THREE.DirectionalLight(0xffd060, 0.8)).position.set(0,8,12);

// Stars
var sGeo = new THREE.BufferGeometry(), sPos = new Float32Array(900);
for(var i=0;i<900;i++) sPos[i]=(Math.random()-.5)*(i%3===1?20:60);
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({color:0xd0a0ff,size:0.10,transparent:true,opacity:0.7})));

// Ground ring — teal/purple glow
var gr = new THREE.Mesh(
  new THREE.RingGeometry(6,6.15,64),
  new THREE.MeshBasicMaterial({color:0xc084fc,opacity:0.10,transparent:true,side:THREE.DoubleSide})
);
gr.rotation.x = -Math.PI/2; gr.position.y = -0.1; scene.add(gr);

const TW=3.4, TD=2.8, TH=0.55;

function addM(g,geo,mat,x,y,z,rx,ry,rz){if(rx===undefined)rx=0;if(ry===undefined)ry=0;if(rz===undefined)rz=0;var m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);g.add(m);return m;}
function bx(w,h,d){return new THREE.BoxGeometry(w,h,d);}
function sp2(r,ws,hs){return new THREE.SphereGeometry(r,ws||8,hs||8);}
function cy(rt,rb,h,s){return new THREE.CylinderGeometry(rt,rb,h,s||8);}
function mk(c,ei){var col=typeof c==='number'?c:c.getHex();var m=new THREE.MeshLambertMaterial({color:col});if(ei&&ei>0){m.emissive=new THREE.Color(col);m.emissiveIntensity=ei;}return m;}
function eyePair(g,y,z){
  var em=new THREE.MeshLambertMaterial({color:0xffffff,emissive:new THREE.Color(0xffffff),emissiveIntensity:1.2});
  [-0.17,0.17].forEach(function(ex){addM(g,sp2(0.065,6,6),em,ex,y,z);});
}
function mouthBar(g,y,z,w){addM(g,bx(w||0.26,0.055,0.045),mk(0xffd060,0.9),0,y,z);}

// ── TILE ──
var tg = new THREE.Group(); scene.add(tg);
addM(tg, bx(TW,TH,TD), mk(0x080008), 0,TH/2,0);
var capM = mk(TILE_COLOR, 0.14); capM.emissive.set(TILE_COLOR);
addM(tg, bx(TW,0.07,TD), capM, 0,TH+0.035,0);
var edM = mk(TILE_COLOR, 0.4); edM.emissive.set(TILE_COLOR); edM.transparent=true; edM.opacity=0.6;
addM(tg, bx(TW,TH,0.04), edM, 0,TH/2,TD/2);
addM(tg, bx(0.04,TH,TD), edM.clone(), -TW/2,TH/2,0);

// Label texture
(function(){
  var W=512,H=256,cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  var ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,0,12,0.88)';
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(0,0,W,H,18);ctx.fill();}
  else{ctx.fillRect(0,0,W,H);}

  // Top edge glow — teal/purple
  var grd=ctx.createLinearGradient(0,0,W,0);
  grd.addColorStop(0,'transparent');
  grd.addColorStop(0.3,'#c084fc');
  grd.addColorStop(0.5,'#ffd060');
  grd.addColorStop(0.7,'#ff85b3');
  grd.addColorStop(1,'transparent');
  ctx.strokeStyle=grd; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(60,2); ctx.lineTo(W-60,2); ctx.stroke();

  // Carebot number
  ctx.font='bold 20px Nunito,sans-serif';
  ctx.fillStyle='#c084fc'; ctx.globalAlpha=0.85; ctx.textAlign='center';
  ctx.fillText('CAREBOT-41',W/2,34); ctx.globalAlpha=1;

  // Draw mini Venn diagram as icon
  ctx.save();
  ctx.globalAlpha=0.55;
  ctx.strokeStyle='#ff85b3'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(220,70,18,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#c084fc'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(236,70,18,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,208,96,.35)'; ctx.beginPath();
  ctx.arc(220,70,18,0,Math.PI*2); ctx.clip();
  ctx.beginPath(); ctx.arc(236,70,18,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.font='900 8px Nunito,sans-serif'; ctx.fillStyle='#ffd060'; ctx.textAlign='center';
  ctx.fillText('♡',228,74);

  // Title
  ctx.font='900 26px Nunito,sans-serif'; ctx.fillStyle='#fff5f8'; ctx.textAlign='center';
  ctx.fillText('The Skill Overlap',W/2,72);

  // Irony
  ctx.font='italic 17px Quicksand,sans-serif';
  ctx.fillStyle='rgba(224,192,255,0.75)';
  function wrap(t,mw){var ws=t.split(' '),ls=[],cur='';ws.forEach(function(w){var tt=cur?cur+' '+w:w;if(ctx.measureText(tt).width>mw&&cur){ls.push(cur);cur=w;}else cur=tt;});if(cur)ls.push(cur);return ls;}
  var il=wrap('"the skills are the same. the compensation is not."',W-50),iy=102;
  il.slice(0,2).forEach(function(l){ctx.fillText(l,W/2,iy);iy+=22;});

  // Buttons
  function btn(x,y,w,h,b1,b2,tc,lb,bc){
    var g=ctx.createLinearGradient(x,y,x+w,y+h); g.addColorStop(0,b1); g.addColorStop(1,b2);
    ctx.fillStyle=g;
    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,9);ctx.fill();ctx.strokeStyle=bc||'rgba(255,100,150,0.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(x,y,w,h,9);ctx.stroke();}
    else{ctx.fillRect(x,y,w,h);}
    ctx.font='900 19px Nunito,sans-serif'; ctx.fillStyle=tc; ctx.textAlign='center';
    ctx.fillText(lb,x+w/2,y+h/2+6);
  }
  btn(52,H-46,172,36,'#ff2d6b','#c4005a','#fff5f8','HIT ↗');
  btn(240,H-46,172,36,'rgba(192,132,252,0.2)','rgba(192,132,252,0.2)','#e0c0ff','BOT ↗','#c084fc');

  var lp=new THREE.Mesh(
    new THREE.PlaneGeometry(TW-0.1,TD-0.1),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false,depthTest:false})
  );
  lp.rotation.x=-Math.PI/2; lp.position.y=TH+0.12; lp.renderOrder=0; tg.add(lp);
})();

// ── BOT — Venn diagram head ──
// Built with Three.js geometry to match the SVG Venn design
var bot = new THREE.Group();

// Head base — rounded rect shape using a slightly flattened sphere base + box
var headBase = mk(0x0c0010);
addM(bot, bx(1.18,1.35,0.82), headBase, 0,1.04,0);
// Round top corners with spheres
[[-0.42,1.64,0],[0.42,1.64,0],[-0.42,0.38,0],[0.42,0.38,0]].forEach(function(p){
  addM(bot, sp2(0.20,8,8), headBase, p[0],p[1],p[2]);
});

// Ears — small ellipsoid bumps on sides
var earM = mk(0xc084fc, 0.06); earM.emissive.set(0xc084fc);
var earInM = mk(0xff85b3, 0.10); earInM.emissive.set(0xff85b3);
[-0.68, 0.68].forEach(function(ex, ei) {
  var e = addM(bot, sp2(0.14,8,8), earM, ex,1.04,0); e.scale.set(0.7,0.9,0.6);
  var ei2 = addM(bot, sp2(0.08,7,7), ei===0?earInM:mk(0xc084fc,0.12), ex,1.04,0.04);
  ei2.scale.set(0.6,0.7,0.5);
});

// Head outline glow
var hlM = mk(0xc084fc, 0.12); hlM.emissive.set(0xc084fc); hlM.transparent=true; hlM.opacity=0.35;
addM(bot, bx(1.22,1.39,0.86), hlM, 0,1.04,0);

// LEFT CIRCLE — MOTHERS (pink stroke simulation with torus)
var leftCircM = mk(0xff85b3, 0.5); leftCircM.emissive.set(0xff85b3);
var lc = addM(bot, new THREE.TorusGeometry(0.30,0.024,7,22), leftCircM, -0.18,1.06,0.44);
lc.rotation.x = Math.PI/2;

// RIGHT CIRCLE — TECH (purple)
var rightCircM = mk(0xc084fc, 0.5); rightCircM.emissive.set(0xc084fc);
var rc = addM(bot, new THREE.TorusGeometry(0.30,0.024,7,22), rightCircM, 0.18,1.06,0.44);
rc.rotation.x = Math.PI/2;

// INTERSECTION fill — gold disk (clipping approximate with small disk)
var goldFillM = mk(0xffd060, 0.25); goldFillM.emissive.set(0xffd060); goldFillM.transparent=true; goldFillM.opacity=0.22;
var gf = addM(bot, cy(0.14,0.14,0.02,16), goldFillM, 0,1.06,0.44);
gf.rotation.x = Math.PI/2;

// Gold heart/dot in intersection
var goldDotM = mk(0xffd060, 1.0); goldDotM.emissive.set(0xffd060);
addM(bot, sp2(0.038,7,7), goldDotM, 0,1.06,0.45);

// BLUSH marks — soft pink ellipses on cheeks
var blushM = mk(0xff85b3, 0.12); blushM.emissive.set(0xff85b3); blushM.transparent=true; blushM.opacity=0.28;
[-0.44,0.44].forEach(function(bx2){
  var b=addM(bot,sp2(0.12,7,7),blushM,bx2,0.86,0.42);
  b.scale.set(1.2,0.6,0.5);
});

// EYELASH arcs — tiny cylinders above each circle
var lashM = mk(0xff85b3, 0.4); lashM.emissive.set(0xff85b3);
var lashMt = mk(0xc084fc, 0.4); lashMt.emissive.set(0xc084fc);
[[-0.28,1.42,0.44,lashM],[0.28,1.42,0.44,lashMt]].forEach(function(p){
  var l=addM(bot,cy(0.016,0.016,0.12,5),p[3],p[0],p[1],p[2]);
  l.rotation.z=0.4;
  var l2=addM(bot,cy(0.016,0.016,0.10,5),p[3],p[0]-0.06*(p[0]<0?-1:1),p[1]+0.02,p[2]);
  l2.rotation.z=0.7*(p[0]<0?-1:1);
});

// CAREBOT label top  
var bodyM = mk(new THREE.Color(0x0c0010).lerp(new THREE.Color(TILE_COLOR),0.45));
var bodyMd = mk(new THREE.Color(0x0c0010).lerp(new THREE.Color(TILE_COLOR),0.25));

// Torso
addM(bot, bx(0.88,0.72,0.64), bodyMd, 0,0.52,0);
// Torso top shimmer
var shimM = mk(TILE_COLOR,0.18); shimM.emissive.set(TILE_COLOR); shimM.transparent=true; shimM.opacity=0.4;
addM(bot, bx(0.82,0.04,0.58), shimM, 0,0.89,0);
// Heart on chest
var heartM = mk(0xffd060,0.9); heartM.emissive.set(0xffd060);
addM(bot, sp2(0.052,7,7), heartM, 0.22,0.60,0.33);

// Arms — rounded
addM(bot, bx(0.18,0.50,0.18), bodyMd, -0.58,0.54,0);
addM(bot, bx(0.18,0.50,0.18), bodyMd,  0.58,0.54,0);
addM(bot, sp2(0.12,7,7), mk(TILE_COLOR,0.25), -0.58,0.26,0);
addM(bot, sp2(0.12,7,7), mk(TILE_COLOR,0.25),  0.58,0.26,0);

// Legs
addM(bot, bx(0.20,0.42,0.20), bodyMd, -0.22,0.12,0);
addM(bot, bx(0.20,0.42,0.20), bodyMd,  0.22,0.12,0);

// Feet — rounded
var footM = mk(0xc084fc,0.15); footM.emissive.set(0xc084fc);
var lFoot = addM(bot, bx(0.32,0.13,0.22), footM, -0.22,-0.11,0.04); lFoot.scale.z=1;
var rFoot = addM(bot, bx(0.32,0.13,0.22), footM,  0.22,-0.11,0.04);
// Round feet slightly
[lFoot,rFoot].forEach(function(f){f.scale.set(1.0,0.85,1.1);});

// Left/right circle LABELS — tiny cylinders as word indicator lines
var lLabelM = mk(0xff85b3, 0.35); lLabelM.emissive.set(0xff85b3); lLabelM.transparent=true; lLabelM.opacity=0.5;
var rLabelM = mk(0xc084fc, 0.35); rLabelM.emissive.set(0xc084fc); rLabelM.transparent=true; rLabelM.opacity=0.5;
[0,1,2].forEach(function(li){
  addM(bot,bx(0.14,0.014,0.014),lLabelM,-0.36,1.22-li*0.06,0.43);
  addM(bot,bx(0.14,0.014,0.014),rLabelM, 0.28,1.22-li*0.06,0.43);
});

bot.scale.setScalar(0.82);
botScene.add(bot);

// Point light that follows bot and pulses gold/purple
var bl = new THREE.PointLight(0xc084fc, 3.5, 14);
bl.position.set(0,2.5,-2); botScene.add(bl);
var goldLight = new THREE.PointLight(0xffd060, 2.0, 8);
goldLight.position.set(0,1.5,1); botScene.add(goldLight);

// ── CHAIR OBJECT — workplace/domestic overlap ──
var obj = new THREE.Group();
var chairBodyM = mk(new THREE.Color(TILE_COLOR).lerp(new THREE.Color(0x080002),0.55));
var chairAccM = mk(TILE_COLOR, 0.12); chairAccM.emissive.set(TILE_COLOR);
var chairGlowM = mk(TILE_COLOR, 0.35); chairGlowM.emissive.set(TILE_COLOR);

// Seat
addM(obj, bx(0.56,0.06,0.50), chairGlowM, 0,0.52,0);
addM(obj, bx(0.52,0.04,0.46), chairAccM, 0,0.545,0);
// Back legs + back rest
addM(obj, cy(0.033,0.033,0.60,7), chairBodyM, -0.21,0.81,0.23);
addM(obj, cy(0.033,0.033,0.60,7), chairBodyM,  0.21,0.81,0.23);
// Back panels
addM(obj, bx(0.50,0.05,0.044), chairGlowM, 0,0.90,0.23);
addM(obj, bx(0.50,0.05,0.044), chairAccM, 0,1.04,0.23);
addM(obj, bx(0.50,0.05,0.044), chairAccM, 0,1.16,0.23);
// Front legs
[[-0.21,0.25,-0.21],[0.21,0.25,-0.21],[-0.21,0.25,0.21],[0.21,0.25,0.21]].forEach(function(p){
  addM(obj,cy(0.030,0.030,0.50,7),chairBodyM,p[0],p[1],p[2]);
});
// Cross brace
addM(obj, cy(0.023,0.023,0.46,6), chairGlowM, 0,0.22,0,0,0,Math.PI/2);

// Tiny floating Venn symbol above chair (like the bot's head symbol)
var vennPinkM = mk(0xff85b3,0.6); vennPinkM.emissive.set(0xff85b3); vennPinkM.transparent=true; vennPinkM.opacity=0.7;
var vennPurpM = mk(0xc084fc,0.6); vennPurpM.emissive.set(0xc084fc); vennPurpM.transparent=true; vennPurpM.opacity=0.7;
var vennGoldM = mk(0xffd060,0.8); vennGoldM.emissive.set(0xffd060);
var miniV = new THREE.Group();
addM(miniV, new THREE.TorusGeometry(0.11,0.012,6,14), vennPinkM, -0.06,0,0); miniV.children[miniV.children.length-1].rotation.x=Math.PI/2;
addM(miniV, new THREE.TorusGeometry(0.11,0.012,6,14), vennPurpM,  0.06,0,0); miniV.children[miniV.children.length-1].rotation.x=Math.PI/2;
addM(miniV, sp2(0.022,6,6), vennGoldM, 0,0,0);
miniV.position.set(0,1.44,0);
obj.add(miniV);

obj.scale.setScalar(0.82);
obj.position.set(0.70, TH+0.02, 0);
botScene.add(obj);

// ── ORBIT CONTROLS ──
var isDragging=false, pM={x:0,y:0}, sph={t:0.20,p:0.72,r:isMobile?8.5:9.5}, ppd=0;
canvas.addEventListener('mousedown',function(e){isDragging=true;pM={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup',function(){isDragging=false;});
window.addEventListener('mousemove',function(e){if(!isDragging)return;sph.t-=(e.clientX-pM.x)*0.007;sph.p=Math.max(0.18,Math.min(1.3,sph.p+(e.clientY-pM.y)*0.006));pM={x:e.clientX,y:e.clientY};});
canvas.addEventListener('wheel',function(e){e.preventDefault();sph.r=Math.max(4,Math.min(22,sph.r+e.deltaY*0.03));},{passive:false});
canvas.addEventListener('touchstart',function(e){e.preventDefault();if(e.touches.length===1){isDragging=true;pM={x:e.touches[0].clientX,y:e.touches[0].clientY};}else if(e.touches.length===2){isDragging=false;var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;ppd=Math.sqrt(dx*dx+dy*dy);}},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();if(e.touches.length===0)isDragging=false;},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();if(e.touches.length===1&&isDragging){sph.t-=(e.touches[0].clientX-pM.x)*0.007;sph.p=Math.max(0.18,Math.min(1.3,sph.p+(e.touches[0].clientY-pM.y)*0.006));pM={x:e.touches[0].clientX,y:e.touches[0].clientY};}else if(e.touches.length===2){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);if(ppd>0)sph.r=Math.max(4,Math.min(22,sph.r-(d-ppd)*0.04));ppd=d;}},{passive:false});

// ── ANIMATE ──
var t = 0;
var xF=0.28+(BOT_IDX%7)*0.07, zF=0.21+(BOT_IDX%5)*0.09;
var xPh=(BOT_IDX*2.39)%(Math.PI*2), zPh=(BOT_IDX*1.73)%(Math.PI*2);
var hX=TW/2*0.38, hZ=TD/2*0.40;
var wS=0.9+(BOT_IDX%9)*0.18, bA=0.04+(BOT_IDX%8)*0.015;

function animate(){
  requestAnimationFrame(animate); t+=0.016;

  var cx=sph.r*Math.sin(sph.p)*Math.sin(sph.t);
  var cy2=sph.r*Math.cos(sph.p);
  var cz=sph.r*Math.sin(sph.p)*Math.cos(sph.t);
  camera.position.set(cx,cy2+1.2,cz); camera.lookAt(0,1,0);

  tg.position.y = Math.sin(t*1.1)*0.055;

  // Bot roaming
  var rx=Math.sin(t*xF+xPh)*hX-0.50;
  var rz=Math.cos(t*zF+zPh)*hZ;
  bot.position.x=rx; bot.position.z=rz;
  bot.position.y=tg.position.y+TH+0.02+Math.abs(Math.sin(t*wS*2))*bA;
  var dx=Math.cos(t*xF+xPh)*hX*xF, dz=-Math.sin(t*zF+zPh)*hZ*zF;
  if(Math.abs(dx)+Math.abs(dz)>0.001) bot.rotation.y=Math.atan2(dx,dz);

  // Personality: type 0 — happy bouncer with gentle head bob
  var b = Math.abs(Math.sin(t*2.8));
  bot.scale.y = 0.85+b*0.15; bot.scale.x = 1+b*0.04; bot.scale.z = 1+b*0.04;
  bot.rotation.z = Math.sin(t*2.8)*0.08;

  // Pulse the Venn circles on the head — alternate pink/teal glow
  lc.material.emissiveIntensity = 0.4+Math.sin(t*2.2)*0.3;
  rc.material.emissiveIntensity = 0.4+Math.sin(t*2.2+Math.PI)*0.3;
  gf.material.opacity = 0.15+Math.abs(Math.sin(t*1.8))*0.18;

  // Chair object animation
  obj.position.y = tg.position.y+TH+0.02+Math.sin(t*0.7+1.0)*0.038;
  obj.rotation.y += 0.006;

  // Mini Venn above chair rotates
  miniV.rotation.y += 0.02;
  miniV.position.y = 1.44+Math.sin(t*1.4)*0.06;

  // Gold dot pulse
  goldDotM.emissiveIntensity = 0.7+Math.sin(t*3)*0.5;

  // Lights follow bot
  bl.position.set(bot.position.x, bot.position.y+1.5, bot.position.z-2);
  bl.intensity = 3.0+Math.sin(t*1.8)*1.2;
  goldLight.position.set(bot.position.x*0.5, bot.position.y+0.8, bot.position.z+1);
  goldLight.intensity = 1.5+Math.sin(t*2.2+1)*0.8;

  gr.rotation.z += 0.002;

  renderer.autoClear=true; renderer.render(scene,camera);
  renderer.autoClear=false; renderer.render(botScene,camera); renderer.autoClear=true;
}
animate();
</script>
</body>
</html>
