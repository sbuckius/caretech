<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAREtech ✦ Live Aggregated Results</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
:root {
  --rose:#ff5c8a;--hot:#ff2d6b;--candy:#ff85b3;--blush:#ffb3cf;--bubble:#ffe4f0;
  --cream:#fff5f8;--berry:#c4005a;--fuchsia:#ff1f80;--bg:#1a0012;
  --card:rgba(255,255,255,.055);--cb:rgba(255,160,200,.22);--cbb:rgba(255,100,160,.55);
  --sg:0 4px 30px rgba(255,45,107,.2),0 1px 0 rgba(255,160,200,.12) inset;
  --pg:0 6px 40px rgba(255,45,107,.4),0 0 80px rgba(255,30,128,.15);
  --td:rgba(255,200,224,.55);--fh:'Nunito',sans-serif;--fb:'Quicksand',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:var(--fb);font-weight:600;color:var(--cream);background:var(--bg);}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 55% at 18% 12%,rgba(200,0,50,.35) 0%,transparent 60%),radial-gradient(ellipse 55% 65% at 82% 80%,rgba(140,0,40,.3) 0%,transparent 60%),linear-gradient(160deg,#200008,#180008 50%,#120005);}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(60px);opacity:.18;}
.orb-1{width:400px;height:400px;background:var(--hot);top:-100px;left:-80px;animation:d1 18s ease-in-out infinite;}
.orb-2{width:320px;height:320px;background:#c40032;bottom:-60px;right:-60px;animation:d2 22s ease-in-out infinite;}
.orb-3{width:200px;height:200px;background:var(--candy);top:40%;left:60%;animation:d3 14s ease-in-out infinite;}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-20px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}33%{transform:translate(-20px,15px)}66%{transform:translate(15px,-10px)}}
.sparkles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.sp{position:absolute;opacity:0;animation:fu linear infinite;}
@keyframes fu{0%{opacity:0;transform:translateY(0) scale(.6) rotate(0deg)}15%{opacity:.7}85%{opacity:.4}100%{opacity:0;transform:translateY(-120px) scale(1.1) rotate(180deg)}}

/* HEADER */
.hdr{position:sticky;top:0;z-index:200;background:rgba(18,0,10,.92);backdrop-filter:blur(20px);border-bottom:1.5px solid var(--cb);padding:0 clamp(16px,3vw,28px);height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.hdr::after{content:'';position:absolute;bottom:0;left:8%;right:8%;height:1.5px;background:linear-gradient(90deg,transparent,var(--candy) 35%,var(--hot) 50%,var(--candy) 65%,transparent);box-shadow:0 0 10px var(--candy);border-radius:999px;}
.hdr-logo{font-family:var(--fh);font-size:20px;font-weight:900;background:linear-gradient(90deg,var(--blush),var(--fuchsia) 55%,var(--candy));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hdr-r{display:flex;align-items:center;gap:12px;}
.live-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,45,107,.1);border:1px solid var(--cbb);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--candy);font-family:var(--fh);font-weight:800;}
.live-pip{width:6px;height:6px;border-radius:50%;background:var(--hot);box-shadow:0 0 8px var(--hot);animation:br 2s ease-in-out infinite;}
@keyframes br{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
.clk{font-size:12px;color:var(--td);letter-spacing:.08em;}

/* SUMMARY */
.summary{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:rgba(255,100,160,.12);border-bottom:1.5px solid var(--cb);}
.sbox{background:rgba(14,0,8,.85);padding:14px 18px;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(10px);}
.sval{font-family:var(--fh);font-size:24px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--blush) 20%,var(--fuchsia) 55%,var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;}
.slbl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--td);}

/* WRAP */
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:24px clamp(14px,3vw,28px) 60px;display:grid;gap:16px;}

/* SECTION HEADING */
.sec-head{display:flex;align-items:center;gap:14px;margin-top:8px;}
.sec-head:first-child{margin-top:0;}
.sec-line{flex:1;height:1px;background:rgba(255,100,160,.15);}
.sec-badge{font-family:var(--fh);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:3px 11px;border-radius:999px;border:1px solid var(--cbb);color:var(--candy);white-space:nowrap;}

/* PANEL BASE */
.panel{background:var(--card);border:1.5px solid var(--cb);border-radius:20px;overflow:hidden;position:relative;backdrop-filter:blur(16px) saturate(1.4);transition:border-color .2s,box-shadow .2s;}
.panel::before{content:'';position:absolute;top:0;left:12px;right:12px;height:1px;background:linear-gradient(90deg,transparent,var(--candy) 30%,var(--hot) 50%,var(--candy) 70%,transparent);box-shadow:0 0 8px var(--candy);border-radius:999px;opacity:.6;}
.panel:hover{border-color:var(--cbb);box-shadow:var(--sg);}

.panel-head{padding:14px 18px 10px;border-bottom:1px solid rgba(255,100,160,.1);}
.panel-eyebrow{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--td);margin-bottom:4px;font-family:var(--fh);font-weight:800;}
.panel-title{font-family:var(--fh);font-weight:900;font-size:14px;color:var(--blush);line-height:1.35;}
.panel-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;}

/* LOADING STATE */
.loading-msg{font-size:12px;color:var(--td);letter-spacing:.08em;text-align:center;padding:20px;animation:blink 1.2s step-start infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.error-msg{font-size:11px;color:rgba(255,180,64,.7);letter-spacing:.06em;text-align:center;padding:16px;}
.empty-msg{font-size:11px;color:var(--td);text-align:center;padding:16px;font-style:italic;}

/* STAT ROW */
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(255,45,107,.05);border:1px solid rgba(255,100,160,.1);}
.stat-name{font-size:12px;color:rgba(255,200,224,.8);}
.stat-num{font-family:var(--fh);font-weight:900;font-size:15px;background:linear-gradient(135deg,var(--blush),var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;font-variant-numeric:tabular-nums;}

/* BAR CHART */
.bar-chart{display:flex;flex-direction:column;gap:7px;}
.bar-row{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:8px;}
.bar-label{font-size:11px;color:rgba(255,200,224,.75);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{height:8px;border-radius:999px;background:rgba(255,45,107,.1);border:1px solid rgba(255,100,160,.15);overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--berry),var(--hot),var(--candy));box-shadow:0 0 8px rgba(255,45,107,.4);transition:width .6s cubic-bezier(.34,1.2,.64,1);}
.bar-fill.green{background:linear-gradient(90deg,#006640,#00c853,#69f0ae);}
.bar-fill.blue{background:linear-gradient(90deg,#01579b,#0288d1,#80d8ff);}
.bar-fill.amber{background:linear-gradient(90deg,#e65100,#ff6d00,#ffd180);}
.bar-fill.purple{background:linear-gradient(90deg,#4a148c,#7b1fa2,#ce93d8);}
.bar-val{font-family:var(--fh);font-weight:900;font-size:11px;color:var(--candy);text-align:right;font-variant-numeric:tabular-nums;}

/* COMPARISON PANEL */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.compare-col{display:flex;flex-direction:column;gap:6px;}
.compare-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--td);font-family:var(--fh);font-weight:800;margin-bottom:2px;}
.compare-big{font-family:var(--fh);font-size:28px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.compare-big.lol{background:linear-gradient(135deg,var(--candy),var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;}
.compare-big.ind{background:linear-gradient(135deg,#80d8ff,#0288d1);-webkit-background-clip:text;background-clip:text;color:transparent;}
.compare-sub{font-size:10px;color:var(--td);}
.compare-vs{align-self:center;font-family:var(--fh);font-weight:900;font-size:11px;color:var(--td);text-align:center;}

/* INSIGHT BOX */
.insight{background:rgba(255,45,107,.07);border:1.5px solid rgba(255,100,160,.25);border-radius:12px;padding:12px 14px;font-size:12px;color:rgba(255,200,224,.8);line-height:1.7;}
.insight strong{color:var(--blush);}

/* TWO COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.two-col{grid-template-columns:1fr;}.compare-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:500px){.bar-row{grid-template-columns:80px 1fr 36px;}.bar-label{font-size:10px;}}

/* EMOTION GRID */
.emotion-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;}

/* SLIDER AVG */
.slider-display{display:flex;flex-direction:column;gap:4px;}
.slider-label-row{display:flex;justify-content:space-between;align-items:center;}
.slider-lbl{font-size:11px;color:rgba(255,200,224,.75);}
.slider-avg{font-family:var(--fh);font-weight:900;font-size:13px;color:var(--candy);}
.slider-track{height:6px;border-radius:999px;background:rgba(255,45,107,.1);border:1px solid rgba(255,100,160,.15);overflow:hidden;}
.slider-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--berry),var(--hot),var(--candy));transition:width .6s cubic-bezier(.34,1.2,.64,1);}
.slider-ends{display:flex;justify-content:space-between;font-size:9px;color:var(--td);margin-top:2px;}

/* TAG CLOUD */
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px;}
.tag-pill{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(255,45,107,.1);border:1px solid rgba(255,100,160,.25);color:rgba(255,200,224,.8);font-family:var(--fb);display:flex;align-items:center;gap:5px;}
.tag-pill .tct{font-family:var(--fh);font-weight:900;font-size:11px;color:var(--candy);}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:rgba(255,100,160,.3);border-radius:3px;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
<div class="sparkles" id="sparkles"></div>

<header class="hdr">
  <div class="hdr-logo">CAREtech ✦ Aggregated Results</div>
  <div class="hdr-r">
    <div class="live-badge"><div class="live-pip"></div>Live</div>
    <div class="clk" id="clk">--:--:--</div>
  </div>
</header>

<div class="summary">
  <div class="sbox"><div class="sval" id="s-n">—</div><div class="slbl">Total Responses</div></div>
  <div class="sbox"><div class="sval" id="s-bots">—</div><div class="slbl">Panels Loaded</div></div>
  <div class="sbox"><div class="sval" id="s-panels">0</div><div class="slbl">Panels Ready</div></div>
  <div class="sbox"><div class="sval" id="s-updated">—</div><div class="slbl">Last Updated</div></div>
</div>

<div class="wrap" id="wrap">
  <div style="text-align:center;padding:40px;color:var(--td);font-size:13px;letter-spacing:.08em;">✦ Loading data from all Firebase projects…</div>
</div>

<script>
// ── Sparkles ──
(function(){const w=document.getElementById('sparkles'),ch=['✦','✧','♡','˚','·','✿','◦','❀'];for(let i=0;i<28;i++){const s=document.createElement('span');s.className='sp';s.textContent=ch[Math.floor(Math.random()*ch.length)];s.style.left=Math.random()*100+'vw';s.style.bottom=Math.random()*-60+'px';s.style.fontSize=(10+Math.random()*10)+'px';s.style.color=`hsl(${320+Math.random()*40},80%,${70+Math.random()*20}%)`;s.style.animationDuration=(6+Math.random()*12)+'s';s.style.animationDelay=(Math.random()*12)+'s';w.appendChild(s);}})();
function tick(){const n=new Date(),p=v=>String(v).padStart(2,'0');document.getElementById('clk').textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;}
setInterval(tick,1000);tick();

// ══════════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════════
const CFGS={
  collab:{apiKey:"AIzaSyCZFDU-WlSmHqjXTs1Ox0nf9xeJU_xbaX0",authDomain:"collaborativemashup.firebaseapp.com",databaseURL:"https://collaborativemashup-default-rtdb.firebaseio.com",projectId:"collaborativemashup",storageBucket:"collaborativemashup.firebasestorage.app",messagingSenderId:"562437984610",appId:"1:562437984610:web:9f3711c26e097bc8ef9c3b"},
  automat:{apiKey:"AIzaSyC3g3xIJ7408oAY4Cdfm9ZdERrWB8cn06o",authDomain:"automation-human-tasks.firebaseapp.com",projectId:"automation-human-tasks",storageBucket:"automation-human-tasks.firebasestorage.app",messagingSenderId:"724157436401",appId:"1:724157436401:web:e45bc71ebe0e3e5669f450"},
  woman:{apiKey:"AIzaSyAT5bd-3SUfXrz9Se_7_rrlDg4PUWY-yCs",databaseURL:"https://womanasinventor-default-rtdb.firebaseio.com",projectId:"womanasinventor"},
  ibm:{apiKey:"AIzaSyAT5bd-3SUfXrz9Se_7_rrlDg4PUWY-yCs",databaseURL:"https://ibm29cardpunch-carebot-default-rtdb.firebaseio.com",projectId:"ibm29cardpunch-carebot"},
  handbook:{apiKey:"AIzaSyAT5bd-3SUfXrz9Se_7_rrlDg4PUWY-yCs",databaseURL:"https://handbookofmathematicalfunction-default-rtdb.firebaseio.com",projectId:"handbookofmathematicalfunction"},
  cook:{apiKey:"AIzaSyAT5bd-3SUfXrz9Se_7_rrlDg4PUWY-yCs",projectId:"if-only-she-can-cook-image"},
  bias:{apiKey:"AIzaSyDvkA5lWmP5tU27-GhlcTcLuFJi4BWO36g",authDomain:"gender-bias-hit.firebaseapp.com",projectId:"gender-bias-hit",storageBucket:"gender-bias-hit.firebasestorage.app",messagingSenderId:"498422138467",appId:"1:498422138467:web:742a7e25e9d7e9398b5a56"},
  whoimp:{apiKey:"AIzaSyAT5bd-3SUfXrz9Se_7_rrlDg4PUWY-yCs",databaseURL:"https://whoimpactstechnology-default-rtdb.firebaseio.com",projectId:"whoimpactstechnology"},
  weave:{apiKey:"AIzaSyAv7mCzyFnVE_pvLQyZsDacdqJo387oCts",authDomain:"weavingdiversedata.firebaseapp.com",projectId:"weavingdiversedata",storageBucket:"weavingdiversedata.firebasestorage.app",messagingSenderId:"331704605325",appId:"1:331704605325:web:69b17c5590bc12e8c7a0c4"},
  honey:{apiKey:"AIzaSyCOq3yuuvOiUlJILo_RbBoXf0WYGJBaLRE",authDomain:"misshoneywell.firebaseapp.com",databaseURL:"https://misshoneywell-default-rtdb.firebaseio.com",projectId:"misshoneywell",storageBucket:"misshoneywell.firebasestorage.app",messagingSenderId:"112158461514",appId:"1:112158461514:web:9f42950241d9abe1c3e0b3"}
};
const apps={},dbs={},stores={};
function app(k){if(!apps[k]){try{apps[k]=firebase.initializeApp(CFGS[k],k);}catch(e){apps[k]=firebase.app(k);}}return apps[k];}
function db(k){if(!dbs[k]){try{dbs[k]=firebase.database(app(k));}catch(e){return null;}}return dbs[k];}
function fs(k){if(!stores[k]){try{stores[k]=firebase.firestore(app(k));}catch(e){return null;}}return stores[k];}
async function rtdbAll(key,path){try{const s=await db(key).ref(path).once('value');const v=s.val();return v?Object.values(v):[];}catch(e){return null;}}
async function fsAll(key,col){try{const s=await fs(key).collection(col).get();return s.docs.map(d=>d.data());}catch(e){return null;}}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
const pct=(n,t)=>t?Math.round(n/t*100):0;
function freqMap(arr){const m={};arr.forEach(v=>{m[v]=(m[v]||0)+1;});return m;}
function sortedFreq(arr){return Object.entries(freqMap(arr)).sort((a,b)=>b[1]-a[1]);}
function safeNum(v){const n=parseFloat(v);return isNaN(n)?null:n;}

// ══════════════════════════════════════════
// DOM BUILDERS
// ══════════════════════════════════════════
function secHead(label){
  const d=document.createElement('div');d.className='sec-head';
  d.innerHTML=`<div class="sec-line"></div><div class="sec-badge">${label}</div><div class="sec-line"></div>`;
  return d;
}

function panel(eyebrow,title,bodyFn){
  const d=document.createElement('div');d.className='panel';
  d.innerHTML=`<div class="panel-head"><div class="panel-eyebrow">${eyebrow}</div><div class="panel-title">${title}</div></div><div class="panel-body" id="pb-${Math.random().toString(36).slice(2)}"></div>`;
  const body=d.querySelector('.panel-body');
  bodyFn(body);
  return d;
}

function loading(el){el.innerHTML=`<div class="loading-msg">✦ Loading…</div>`;}
function errMsg(el,msg){el.innerHTML=`<div class="error-msg">⚠ ${msg}</div>`;}
function emptyMsg(el,msg){el.innerHTML=`<div class="empty-msg">${msg}</div>`;}

function barChart(el,rows,maxVal,colorClass=''){
  // rows: [{label, val, count}]
  const max=maxVal||Math.max(...rows.map(r=>r.val));
  el.innerHTML='<div class="bar-chart">'+rows.map(r=>{
    const w=max>0?Math.round(r.val/max*100):0;
    return `<div class="bar-row">
      <div class="bar-label" title="${r.label}">${r.label}</div>
      <div class="bar-track"><div class="bar-fill ${colorClass}" style="width:${w}%"></div></div>
      <div class="bar-val">${typeof r.count!=='undefined'?r.count:r.val}</div>
    </div>`;
  }).join('')+'</div>';
}

function sliderAvg(el,rows){
  // rows: [{label, avg, min, max}]
  el.innerHTML=rows.map(r=>`
    <div class="slider-display">
      <div class="slider-label-row"><span class="slider-lbl">${r.label}</span><span class="slider-avg">${r.avg.toFixed(2)}/10</span></div>
      <div class="slider-track"><div class="slider-fill" style="width:${r.avg*10}%"></div></div>
      <div class="slider-ends"><span>1</span><span>10</span></div>
    </div>`).join('');
}

function tagCloud(el,pairs){
  // pairs: [[tag, count], ...]
  const max=pairs[0]?.[1]||1;
  el.innerHTML='<div class="tag-cloud">'+pairs.map(([t,c])=>{
    const size=10+Math.round((c/max)*4);
    return `<span class="tag-pill" style="font-size:${size}px"><span>${t}</span><span class="tct">${c}</span></span>`;
  }).join('')+'</div>';
}

function statRows(el,rows){
  el.innerHTML=rows.map(r=>`<div class="stat-row"><span class="stat-name">${r.label}</span><span class="stat-num">${r.val}</span></div>`).join('');
}

function insight(el,html){
  el.insertAdjacentHTML('beforeend',`<div class="insight">${html}</div>`);
}

// ══════════════════════════════════════════
// PANEL BUILDERS — each returns a rendered panel or null
// ══════════════════════════════════════════

// ── CB02 Miss Honeywell reactions ──
async function buildCB02(wrap){
  const data=await rtdbAll('honey','honeywellReactions');
  const p=panel('CAREBOT-02 · Miss Honeywell 1968','Audience Affect: Surprising · Disturbing · Familiar',el=>{loading(el);});
  wrap.appendChild(p);
  const body=p.querySelector('.panel-body');
  if(!data){errMsg(body,'Could not load honeywellReactions');return 0;}
  if(!data.length){emptyMsg(body,'No reactions yet.');return 0;}

  const surprising=data.map(d=>safeNum(d.surprising)).filter(v=>v!==null);
  const disturbing=data.map(d=>safeNum(d.disturbing)).filter(v=>v!==null);
  const familiar=data.map(d=>safeNum(d.familiar)).filter(v=>v!==null);

  const sliders=[
    {label:'Surprising',avg:avg(surprising)},
    {label:'Disturbing',avg:avg(disturbing)},
    {label:'Familiar / still relevant today',avg:avg(familiar)}
  ];
  const slidDiv=document.createElement('div');sliderAvg(slidDiv,sliders);body.appendChild(slidDiv);

  // tag frequency
  const allTags=data.flatMap(d=>Array.isArray(d.tags)?d.tags:[]);
  if(allTags.length){
    const lbl=document.createElement('div');lbl.style.cssText='font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--td);font-family:var(--fh);font-weight:800;margin-top:4px;';lbl.textContent='✦ Tag Frequency';body.appendChild(lbl);

  if(p14.length&&p24.length){
    const diff=avg(p14)-avg(p24);
    insight(body,`Same images, different task framing. CB14 ("performing computations") boxes <strong>${Math.abs(diff).toFixed(1)}% ${diff>0?'more':'less'}</strong> of the image than CB24 ("technology work"). The label changes what participants see as worth annotating.`);
  }
  return d14.length+d24.length;
}

// ── CB31 Domestic labor annotations ──
async function buildCB31(wrap){
  const data=await rtdbAll('collab','domesticAnnotations');
  const p=panel('CAREBOT-31 · Training AI With Domestic Labor','Paid · Unpaid · Both — Per Task',el=>{loading(el);});
  wrap.appendChild(p);
  const body=p.querySelector('.panel-body');
  if(!data){errMsg(body,'Could not load domesticAnnotations');return 0;}
  if(!data.length){emptyMsg(body,'No annotations yet.');return 0;}

  const TASKS=['washing-dishes','cooking-meals','vacuuming','mopping','laundry-washing','laundry-folding','grocery-shopping','childcare-feeding','childcare-bathing','eldercare-bathing','eldercare-medication','surface-wiping','toilet-cleaning','trash-taking-out','making-beds','pet-care','home-organizing','school-transport'];
  const taskTotals={};
  TASKS.forEach(t=>taskTotals[t]={paid:0,unpaid:0,both:0,total:0});
  data.forEach(d=>{
    if(!d.labels)return;
    Object.entries(d.labels).forEach(([task,label])=>{
      if(taskTotals[task]&&taskTotals[task][label]!==undefined){taskTotals[task][label]++;taskTotals[task].total++;}
    });
  });

  // show % unpaid per task
  const rows=TASKS.map(t=>({
    label:t.replace(/-/g,' '),
    val:taskTotals[t].total?pct(taskTotals[t].unpaid,taskTotals[t].total):0,
    count:taskTotals[t].total?`${pct(taskTotals[t].unpaid,taskTotals[t].total)}%`:'-'
  })).filter(r=>r.val>0).sort((a,b)=>b.val-a.val);

  if(rows.length){
    const lbl=document.createElement('div');lbl.style.cssText='font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--td);font-family:var(--fh);font-weight:800;';lbl.textContent='✦ % Labeled "Unpaid" per Task';body.appendChild(lbl);
    const bDiv=document.createElement('div');barChart(bDiv,rows,100,'amber');body.appendChild(bDiv);
  }

  const totalAnnotations=data.length;
  const allLabels=data.flatMap(d=>Object.values(d.labels||{}));
  const lf=freqMap(allLabels);
  statRows(body,[
    {label:'Total annotations',val:totalAnnotations},
    {label:'Labeled paid',val:lf.paid||0},
    {label:'Labeled unpaid',val:lf.unpaid||0},
    {label:'Labeled both',val:lf.both||0},
  ]);

  const mostUnpaid=rows[0];
  if(mostUnpaid){insight(body,`<strong>${mostUnpaid.label}</strong> is most consistently labeled "unpaid" (${mostUnpaid.count} of responses). This data trains the AI categories in real time.`);}
  return totalAnnotations;
}

// ── CB33 CEO Robot Human ──
async function buildCB33(wrap){
  const data=await rtdbAll('collab','cb33Responses');
  const p=panel('CAREBOT-33 · CEO · Robot · Human','Who Owns the Robot? + Task Annotations',el=>{loading(el);});
  wrap.appendChild(p);
  const body=p.querySelector('.panel-body');
  if(!data){errMsg(body,'Could not load cb33Responses');return 0;}
  if(!data.length){emptyMsg(body,'No responses yet.');return 0;}

  const polls=data.filter(d=>d.type==='poll');
  const annotations=data.filter(d=>d.type==='annotation');
  const resolutions=data.filter(d=>d.type==='resolution');

  if(polls.length){
    const votes=polls.map(d=>d.vote).filter(Boolean);
    const sf=sortedFreq(votes);
    const lbl=document.createElement('div');lbl.style.cssText='font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--td);font-family:var(--fh);font-weight:800;';lbl.textContent='✦ Who Owns the Robot?';body.appendChild(lbl);
    const pDiv=document.createElement('div');barChart(pDiv,sf.map(([v,c])=>({label:v,val:c,count:`${c} (${pct(c,votes.length)}%)`})),votes.length,'purple');body.appendChild(pDiv);
  }

  if(resolutions.length){
    const ratings=resolutions.map(d=>safeNum(d.rating)).filter(v=>v!==null);
    const rDiv=document.createElement('div');sliderAvg(rDiv,[{label:'How resolved does the contradiction feel? (1-5 scaled)',avg:avg(ratings)*2}]);body.appendChild(rDiv);
  }

  // annotation: % labeled CEO vs robot vs human per task
  if(annotations.length){
    const TASKS=['washing-dishes','cooking-meals','vacuuming','mopping','laundry-washing','laundry-folding','grocery-shopping','feeding-children','bathing-children','bathing-elderly','medication','wiping-surfaces','toilet-cleaning','taking-out-trash','making-beds','pet-care','home-organizing','transporting-children'];
    const taskTotals={};TASKS.forEach(t=>taskTotals[t]={ceo:0,robot:0,human:0,total:0});
    annotations.forEach(d=>{if(!d.labels)return;Object.entries(d.labels).forEach(([t,l])=>{if(taskTotals[t]&&taskTotals[t][l]!==undefined){taskTotals[t][l]++;taskTotals[t].total++;}});});
    const ceoRows=TASKS.map(t=>({label:t.replace(/-/g,' '),val:taskTotals[t].total?pct(taskTotals[t].ceo,taskTotals[t].total):0,count:taskTotals[t].total?pct(taskTotals[t].ceo,taskTotals[t].total)+'%':'-'})).filter(r=>r.val>0).sort((a,b)=>b.val-a.val).slice(0,8);
    if(ceoRows.length){
      const lbl2=document.createElement('div');lbl2.style.cssText='font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--td);font-family:var(--fh);font-weight:800;';lbl2.textContent='✦ % Tasks Labeled "CEO" (top 8)';body.appendChild(lbl2);
      const aDiv=document.createElement('div');barChart(aDiv,ceoRows,100);body.appendChild(aDiv);
    }
  }

  statRows(body,[{label:'Poll votes',val:polls.length},{label:'Annotations',val:annotations.length},{label:'Resolution ratings',val:resolutions.length}]);
  return data.length;
}

// ── CB22 Kitchen Computer Survey ──
async function buildCB22(wrap){
  const data=await fsAll('cook','kc_responses');
  const p=panel('CAREBOT-22 · Kitchen Computer Survey','Yes / No / Neutral per Question',el=>{loading(el);});
  wrap.appendChild(p);
  const body=p.querySelector('.panel-body');
  if(!data){errMsg(body,'Could not load kc_responses');return 0;}
  if(!data.length){emptyMsg(body,'No responses yet.');return 0;}

  const rows=data.map(d=>{
    const yes=safeNum(d.yes)||0;const no=safeNum(d.no)||0;const neu=safeNum(d.neutral)||0;
    const tot=yes+no+neu;
    return{id:d.id||'?',yes,no,neu,tot,pctYes:tot?pct(yes,tot):0};
  }).filter(r=>r.tot>0).sort((a,b)=>b.pctYes-a.pctYes);

  if(rows.length){
    const lbl=document.createElement('div');lbl.style.cssText='font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--td);font-family:var(--fh);font-weight:800;';lbl.textContent='✦ % "Yes" per Question (ranked)';body.appendChild(lbl);
    const bDiv=document.createElement('div');
    barChart(bDiv,rows.slice(0,10).map(r=>({label:String(r.id).replace(/t\d+_q/,'Q'),val:r.pctYes,count:r.pctYes+'%'})),100,'green');
    body.appendChild(bDiv);
  }
  statRows(body,[{label:'Question records',val:data.length}]);
  return data.length;
}
