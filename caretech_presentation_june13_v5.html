<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>✦ CAREtech · The Mother of All Demos</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --rose:#ff5c8a; --hot:#ff2d6b; --candy:#ff85b3; --blush:#ffb3cf;
  --cream:#fff5f8; --berry:#c4005a; --maroon:#6f001e; --fuchsia:#ff1f80;
  --bg:#1a0012; --card:rgba(255,255,255,.055);
  --cb:rgba(255,160,200,.22); --cbb:rgba(255,100,160,.55);
  --sg:0 4px 30px rgba(255,45,107,.2),0 1px 0 rgba(255,160,200,.12) inset;
  --pg:0 8px 50px rgba(255,45,107,.45),0 0 100px rgba(255,30,128,.18);
  --dim:rgba(255,200,224,.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Quicksand',sans-serif;font-weight:600;color:var(--cream);background:var(--bg);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow:hidden}
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 10% 15%,rgba(180,0,50,.4) 0%,transparent 55%),radial-gradient(ellipse 60% 70% at 90% 85%,rgba(120,0,30,.35) 0%,transparent 55%),linear-gradient(160deg,#220008,#180008 45%,#120005)}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(70px);will-change:transform}
.o1{width:500px;height:500px;background:var(--maroon);opacity:.25;top:-120px;left:-100px;animation:d1 20s ease-in-out infinite}
.o2{width:400px;height:400px;background:#c40032;opacity:.2;bottom:-80px;right:-80px;animation:d2 24s ease-in-out infinite}
.o3{width:300px;height:300px;background:var(--hot);opacity:.12;top:35%;left:55%;animation:d3 16s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,35px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}33%{transform:translate(-25px,18px)}66%{transform:translate(18px,-12px)}}
.presenter{position:relative;z-index:10;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.deck{width:min(96vw,1280px);aspect-ratio:16/9;position:relative;border-radius:18px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.7),0 0 0 1.5px var(--cbb),var(--pg)}
.slide{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:4.5%;overflow:hidden}
.slide.active{display:flex;animation:sIn .45s cubic-bezier(.22,1,.36,1) both}
@keyframes sIn{from{opacity:0;transform:translateX(32px) scale(.97)}to{opacity:1;transform:none}}
.slide-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 75% 55% at 8% 12%,rgba(180,0,50,.38) 0%,transparent 52%),radial-gradient(ellipse 55% 65% at 92% 88%,rgba(120,0,30,.32) 0%,transparent 52%),linear-gradient(160deg,#220008,#180008 45%,#120005)}
.sorb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(55px)}
.s1{width:42%;height:42%;background:var(--maroon);opacity:.28;top:-8%;left:-6%;animation:d1 18s ease-in-out infinite}
.s2{width:32%;height:32%;background:#c40032;opacity:.22;bottom:-6%;right:-4%;animation:d2 22s ease-in-out infinite}
.shimmer{position:absolute;top:0;left:8%;right:8%;height:1.5px;background:linear-gradient(90deg,transparent,var(--candy) 30%,var(--hot) 50%,var(--candy) 70%,transparent);box-shadow:0 0 12px var(--candy);border-radius:999px;z-index:2}
.sc{position:relative;z-index:5;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lbl{font-size:clamp(8px,.9vw,10px);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.ttl{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(20px,3.8vw,48px);line-height:1.18;text-align:center;background:linear-gradient(120deg,var(--cream) 20%,var(--blush) 55%,var(--fuchsia) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em}
.sub{font-size:clamp(10px,1.35vw,15px);color:var(--dim);text-align:center;margin-top:8px;max-width:72%;line-height:1.65}
.glass{background:rgba(15,0,8,.72);border:1.5px solid var(--cbb);border-radius:16px;box-shadow:var(--sg),inset 0 1px 0 rgba(255,160,200,.07);backdrop-filter:blur(18px);padding:clamp(11px,1.7vw,22px) clamp(13px,2vw,26px);position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--candy) 40%,var(--hot) 50%,var(--candy) 60%,transparent)}
.blist{list-style:none;display:flex;flex-direction:column;gap:clamp(5px,.9vh,9px);margin-top:clamp(7px,1.3vh,12px)}
.blist li{display:flex;align-items:flex-start;gap:7px;font-size:clamp(9px,1.1vw,13px);line-height:1.5;color:rgba(255,210,228,.85)}
.blist li::before{content:'✦';color:var(--hot);font-size:.8em;margin-top:.15em;flex-shrink:0}
.snb{position:absolute;top:3.5%;right:3%;z-index:10;font-size:clamp(7px,.82vw,10px);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:3px 9px;background:rgba(255,255,255,.04);border:1px solid var(--cb);border-radius:999px}
.slide-robot{position:absolute;bottom:36px;right:clamp(16px,2.5vw,30px);z-index:15;opacity:.82;pointer-events:none}
.slide-robot svg{width:clamp(52px,7vw,80px);height:clamp(52px,7vw,80px);filter:drop-shadow(0 0 14px rgba(255,45,107,.55))}
.tcbot{width:clamp(52px,8vw,88px);height:clamp(52px,8vw,88px);border-radius:20px;background:linear-gradient(135deg,rgba(255,45,107,.2),rgba(180,0,50,.3));border:2px solid var(--cbb);box-shadow:0 0 40px rgba(255,45,107,.4);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;animation:wobble 4s ease-in-out infinite;margin-bottom:clamp(8px,1.5vh,16px)}
.tcbot svg{width:70%;height:70%}
@keyframes wobble{0%,100%{transform:rotate(-2deg) scale(1)}25%{transform:rotate(1deg) scale(1.04)}50%{transform:rotate(-1deg)}75%{transform:rotate(2deg) scale(1.03)}}
.hit-left{flex:1;min-width:180px;max-width:45%;display:flex;flex-direction:column;gap:clamp(7px,1.3vh,13px)}
.ht-row{display:flex;align-items:center;gap:10px}
.hem-svg{width:clamp(38px,5.5vw,64px);height:clamp(38px,5.5vw,64px);flex-shrink:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,45,107,.18),rgba(180,0,50,.28));border:1.5px solid rgba(255,100,160,.4);display:flex;align-items:center;justify-content:center}
.hem-svg svg{width:clamp(24px,3.5vw,42px);height:clamp(24px,3.5vw,42px)}
.htitle{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(14px,2.4vw,30px);background:linear-gradient(120deg,var(--cream) 20%,var(--blush) 55%,var(--fuchsia) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:left;line-height:1.2}
.hdesc{font-size:clamp(9px,1.1vw,13px);color:var(--dim);line-height:1.65;flex:1}
.hlink{display:inline-flex;align-items:center;gap:4px;font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(8px,.95vw,11px);letter-spacing:.06em;color:var(--candy);text-decoration:none;padding:5px 12px;border-radius:999px;background:rgba(255,45,107,.1);border:1px solid var(--cbb);width:fit-content;transition:all .2s}
.hlink:hover{background:rgba(255,45,107,.25);color:var(--cream)}
.hlink.bot-link{background:rgba(255,255,255,.04);border-color:var(--cb);color:var(--blush)}
.train{margin-top:4px;padding:clamp(7px,1vh,11px) clamp(9px,1.2vw,14px);border-radius:9px;background:linear-gradient(135deg,rgba(255,45,107,.14),rgba(180,0,50,.1));border:1.5px solid var(--cbb);position:relative;overflow:hidden}
.train::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,var(--candy) 50%,transparent)}
.train-lbl{font-size:clamp(6px,.75vw,8.5px);letter-spacing:.18em;text-transform:uppercase;color:var(--hot);margin-bottom:3px}
.train-txt{font-size:clamp(8px,.9vw,10.5px);color:var(--dim);line-height:1.5}
.sec-badge{display:inline-flex;align-items:center;gap:8px;padding:5px 16px;border-radius:999px;background:linear-gradient(90deg,rgba(255,45,107,.25),rgba(180,0,50,.15));border:1.5px solid var(--cbb);font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(8px,1vw,12px);letter-spacing:.15em;text-transform:uppercase;color:var(--candy);margin-bottom:10px}
.pat-head{background:rgba(15,0,8,.7);border:1.5px solid var(--cbb);border-radius:10px;padding:5px 14px;display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:10px}
.pat-img{background:rgba(10,0,6,.9);border:1.5px solid var(--cb);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pat-img img{width:100%;height:100%;object-fit:contain;opacity:.85;filter:sepia(.3) hue-rotate(280deg) saturate(1.4) brightness(.9)}
.pat-num-overlay{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(8px,.9vw,11px);color:var(--blush);letter-spacing:.1em;opacity:.7}
.inv-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(13px,1.7vw,20px);color:var(--candy)}
.pat-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pat-cell{background:rgba(15,0,8,.65);border:1px solid var(--cb);border-radius:9px;padding:7px 10px}
.pct{font-size:clamp(6px,.72vw,8.5px);letter-spacing:.15em;text-transform:uppercase;color:var(--hot);margin-bottom:3px}
.pcv{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(10px,1.3vw,15px);color:var(--blush)}
.pat-blurb{margin-top:8px;background:rgba(15,0,8,.65);border:1px solid var(--cb);border-radius:9px;padding:9px 11px}
.pat-vlink{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(8px,.9vw,11px);color:var(--candy);text-decoration:none;padding:5px 12px;border-radius:999px;background:rgba(255,45,107,.1);border:1px solid var(--cbb);transition:all .2s}
.pat-vlink:hover{background:rgba(255,45,107,.25);color:var(--cream)}
.col-lbl{font-size:clamp(7px,.85vw,10px);letter-spacing:.18em;text-transform:uppercase;color:var(--hot);margin-bottom:5px}
.slide-links{position:absolute;bottom:clamp(44px,7vh,64px);left:3%;z-index:10;display:flex;gap:6px}
.slink{display:inline-flex;align-items:center;gap:4px;font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(7px,.8vw,10px);letter-spacing:.08em;text-transform:uppercase;color:var(--candy);text-decoration:none;padding:4px 10px;border-radius:999px;background:rgba(255,45,107,.12);border:1px solid var(--cbb);transition:all .2s}
.slink:hover{background:rgba(255,45,107,.28);color:var(--cream)}
.slink.bot-s{background:rgba(255,255,255,.04);border-color:var(--cb);color:var(--blush)}
.vbar{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 18px;background:rgba(8,0,5,.82);backdrop-filter:blur(12px);border-top:1px solid rgba(255,100,160,.13)}
.vbtn{font-family:'Nunito',sans-serif;font-weight:900;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--candy);cursor:pointer;border:none;padding:5px 13px;border-radius:999px;background:rgba(255,45,107,.12);border:1px solid rgba(255,100,160,.3);transition:all .18s;display:flex;align-items:center;gap:5px}
.vbtn:hover{background:rgba(255,45,107,.25)}
.vbtn.spk{background:rgba(255,45,107,.25);border-color:var(--hot);animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,45,107,.3)}50%{box-shadow:0 0 0 5px rgba(255,45,107,0)}}
.vwave{display:flex;align-items:center;gap:2px;height:14px}
.vwave span{display:inline-block;width:2px;border-radius:999px;background:var(--hot);opacity:0;height:3px}
.vbtn.spk .vwave span{opacity:1;animation:wv .6s ease-in-out infinite}
.vwave span:nth-child(1){animation-delay:0s;--h:7px}.vwave span:nth-child(2){animation-delay:.1s;--h:13px}.vwave span:nth-child(3){animation-delay:.2s;--h:9px}.vwave span:nth-child(4){animation-delay:.3s;--h:15px}.vwave span:nth-child(5){animation-delay:.15s;--h:6px}
@keyframes wv{0%,100%{height:3px}50%{height:var(--h,9px)}}
.vstat{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);flex:1;text-align:center}
.vspd{font-size:9px;letter-spacing:.1em;color:var(--dim);display:flex;align-items:center;gap:5px}
.vspd input{width:65px;accent-color:var(--hot);cursor:pointer}
.controls{display:flex;align-items:center;gap:14px;z-index:100}
.cbtn{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;letter-spacing:.08em;color:var(--cream);cursor:pointer;border:none;padding:7px 18px;border-radius:999px;background:rgba(255,45,107,.15);border:1px solid var(--cbb);transition:all .18s}
.cbtn:hover{background:rgba(255,45,107,.3);transform:translateY(-1px)}
.cbtn:disabled{opacity:.3;cursor:default;transform:none}
.ctr{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-width:70px;text-align:center}
.cdots{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:360px}
.dind{width:5px;height:5px;border-radius:50%;background:rgba(255,45,107,.25);border:1px solid var(--cb);cursor:pointer;transition:all .2s}
.dind.on{background:var(--hot);box-shadow:0 0 7px var(--hot);width:15px;border-radius:999px}
.kbd{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,160,200,.16);text-align:center}
.sparks{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.sp{position:absolute;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.6}85%{opacity:.3}100%{opacity:0;transform:translateY(-80px) scale(1)}}
.bq{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(14px,2.5vw,30px);line-height:1.4;text-align:center;max-width:84%;background:linear-gradient(120deg,var(--cream) 0%,var(--blush) 60%,var(--candy) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.qm{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(32px,5.5vw,70px);line-height:.8;color:var(--hot);opacity:.35;display:block;text-align:center}
.chips{display:flex;gap:clamp(5px,.7vw,9px);flex-wrap:wrap;justify-content:center;margin-top:clamp(8px,1.4vh,16px)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:rgba(255,45,107,.08);border:1px solid rgba(255,130,180,.22);font-size:clamp(7px,.85vw,10px);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.chip .dot{width:4px;height:4px;border-radius:50%;background:var(--candy);flex-shrink:0}
.content-two{display:flex;gap:clamp(14px,2.2vw,28px);width:100%;align-items:flex-start;margin-top:clamp(8px,1.5vh,16px)}
.content-main{flex:1.3;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px)}
.content-side{flex:1;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,14px)}
.micon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:clamp(10px,1.3vh,16px) clamp(7px,.9vw,12px);border-radius:16px;background:rgba(15,0,8,.65);border:1.5px solid var(--cb);text-align:center;flex:1;min-width:80px;max-width:110px}
.micon-svg{width:clamp(40px,5vw,56px);height:clamp(40px,5vw,56px);border-radius:14px;background:linear-gradient(135deg,rgba(255,45,107,.18),rgba(180,0,50,.28));border:1.5px solid rgba(255,100,160,.4);display:flex;align-items:center;justify-content:center}
.micon-svg svg{width:clamp(26px,3.2vw,38px);height:clamp(26px,3.2vw,38px)}
.mname{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(8px,1vw,11px);color:var(--candy)}
.mlbl{font-size:clamp(6px,.75vw,8.5px);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);line-height:1.3}
.hit-portal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,1.8vh,18px);width:100%;height:100%}
.hit-qr{width:clamp(80px,12vw,140px);height:clamp(80px,12vw,140px);background:rgba(255,255,255,.9);border-radius:12px;display:flex;align-items:center;justify-content:center;border:3px solid var(--hot);box-shadow:0 0 30px rgba(255,45,107,.5)}
.hit-url{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(12px,1.8vw,22px);color:var(--candy);letter-spacing:.05em;text-align:center}
.picker-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;padding-bottom:0}
.picker-overlay.open{display:flex;animation:slideUp .35s cubic-bezier(.22,1,.36,1) both}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.picker-backdrop{position:absolute;inset:0;background:rgba(10,0,6,.75);backdrop-filter:blur(6px);cursor:pointer}
.picker-panel{position:relative;z-index:1;width:min(98vw,1280px);max-height:72vh;background:rgba(20,0,12,.96);border:1.5px solid var(--cbb);border-bottom:none;border-radius:20px 20px 0 0;box-shadow:0 -8px 60px rgba(255,45,107,.25);display:flex;flex-direction:column;overflow:hidden}
.picker-top{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;border-bottom:1px solid rgba(255,100,160,.12);flex-shrink:0}
.picker-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--candy);flex:1}
.picker-search{flex:2;max-width:320px;background:rgba(255,255,255,.05);border:1px solid var(--cbb);border-radius:999px;padding:6px 14px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:12px;color:var(--cream);outline:none;transition:border .2s}
.picker-search::placeholder{color:var(--dim)}
.picker-search:focus{border-color:var(--hot)}
.picker-close{font-family:'Nunito',sans-serif;font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer;border:none;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--cb);transition:all .18s}
.picker-close:hover{background:rgba(255,45,107,.2);color:var(--cream)}
.picker-grid{overflow-y:auto;padding:8px 0 20px;display:flex;flex-direction:column;flex:1}
.picker-grid::-webkit-scrollbar{width:4px}
.picker-grid::-webkit-scrollbar-thumb{background:var(--cbb);border-radius:999px}
.picker-section-hdr{font-family:'Nunito',sans-serif;font-weight:900;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--hot);padding:12px 18px 5px;border-bottom:1px solid rgba(255,45,107,.15);margin-bottom:2px;position:sticky;top:0;background:rgba(20,0,12,.97);z-index:2}
.picker-row{cursor:pointer;display:flex;align-items:center;gap:12px;padding:7px 18px;transition:background .14s;border-bottom:1px solid rgba(255,100,160,.04)}
.picker-row:hover{background:rgba(255,45,107,.12)}
.picker-row.current{background:rgba(255,45,107,.2);border-left:3px solid var(--hot)}
.picker-row:not(.current){border-left:3px solid transparent}
.pr-num{font-family:'Nunito',sans-serif;font-weight:900;font-size:10px;letter-spacing:.1em;color:var(--hot);min-width:28px;text-align:right;flex-shrink:0}
.pr-icon{width:22px;height:22px;flex-shrink:0;opacity:.8}
.pr-icon svg{width:100%;height:100%}
.pr-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pr-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.pr-label{font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-cur{width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 5px var(--hot);flex-shrink:0}
.picker-btn{font-family:'Nunito',sans-serif;font-weight:900;font-size:11px;letter-spacing:.08em;color:var(--cream);cursor:pointer;border:none;padding:6px 14px;border-radius:999px;background:rgba(255,45,107,.15);border:1px solid var(--cbb);transition:all .18s}
.picker-btn:hover{background:rgba(255,45,107,.3);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker-backdrop" onclick="closePicker()"></div>
  <div class="picker-panel">
    <div class="picker-top">
      <span class="picker-title">✦ Jump to Slide</span>
      <input class="picker-search" id="pickerSearch" type="text" placeholder="Search slides…" oninput="filterPicker(this.value)"/>
      <button class="picker-close" onclick="closePicker()">✕ Close</button>
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</div>

<div class="presenter">
<div class="deck" id="deck">
<div id="all-slides"></div>
</div>
<div class="controls">
  <button class="cbtn" id="prevBtn" disabled>← Prev</button>
  <div class="cdots" id="dots"></div>
  <span class="ctr" id="counter">1 / ?</span>
  <button class="cbtn" id="nextBtn">Next →</button>
  <button class="picker-btn" id="pickerOpenBtn" onclick="openPicker()">☰ All Slides</button>
</div>
<div class="kbd">← → arrow keys · Space = read aloud · F = fullscreen · G = slide picker</div>
</div>

//  SLIDE BUILDERS
//  These functions turn data objects into HTML. You should only need
//  to edit these if you want to change the visual layout of a slide
//  type. To change content, edit the data objects above instead.

function vbar(n) {
  return `<div class="vbar">
  <button class="vbtn" id="vb${n}" onclick="readSlide(${n})"><div class="vwave"><span></span><span></span><span></span><span></span><span></span></div><span id="vl${n}">▶ Read Aloud</span></button>
  <button class="vbtn" onclick="stopSpeech()" style="opacity:.55">■ Stop</button>
  <span class="vstat" id="vs${n}">Female Voice · Web Speech</span>
  <label class="vspd">Speed <input type="range" id="vrate" min=".6" max="1.4" step=".05" value=".95" oninput="document.getElementById('vrv').textContent=parseFloat(this.value).toFixed(2)+'×'"><span id="vrv">.95×</span></label>
  <label class="vspd">Pitch <input type="range" id="vpitch" min=".8" max="1.6" step=".1" value="1.1" oninput="document.getElementById('vpv').textContent=parseFloat(this.value).toFixed(1)"><span id="vpv">1.1</span></label>
</div>`;
}

function robotDeco(iconKey) {
  return `<div class="slide-robot">${ICONS[iconKey]||ICONS.robot}</div>`;
}

function slideWrap(n, voice, type, inner, extraClass='', pickMeta={}) {
  const safeVoice = voice.replace(/"/g,"'").replace(/</g,'').replace(/>/g,'');
  const ptitle = (pickMeta.title||'').replace(/"/g,"'").replace(/</g,'').replace(/>/g,'');
  const plabel = (pickMeta.label||'').replace(/"/g,"'").replace(/</g,'').replace(/>/g,'');
  const ptype  = (pickMeta.type||type||'').replace(/"/g,"'");
  const piconKey = (pickMeta.icon||'robot');
  return `<div class="slide ${extraClass}" id="s${n}"
    data-voice="${safeVoice}"
    data-pick-title="${ptitle}"
    data-pick-label="${plabel}"
    data-pick-type="${ptype}"
    data-pick-icon="${piconKey}">
<div class="slide-bg"></div><div class="sorb s1"></div><div class="sorb s2"></div><div class="shimmer"></div>
${inner}
<div class="snb">${n} / TOTAL</div>
${vbar(n)}
</div>`;
}

// ═══════════════════════════════════════════════════════════════
//  IMAGE / ICON HELPER — used by every slide builder
//
//  slideImages(s, opts) → { html, pos, hasImage }
//
//  Always returns something in the bottom-right corner:
//    • If s.image / s.images is set  → renders the image(s)
//    • If not                         → renders the icon deco instead
//
//  To add an image to any slide, set on the slide data object:
//    s.image      — single image path   e.g. "images/foo.png"
//    s.images     — array of paths      e.g. ["images/a.png","images/b.png"]
//    s.imageSize  — CSS width override  e.g. "clamp(60px,10vw,140px)"
//    s.imagePos   — layout position (only applies when an image is present):
//                     'corner'  (default) — absolute overlay, bottom-right
//                     'right'   — replaces QR / right column
//                     'left'    — becomes left column, text shifts right
//                     'below'   — full-width row below main layout
//                     'top'     — full-width row above main layout
//                     'inline'  — inside text column, below bullets
//
//  opts (optional overrides passed by the builder):
//    defaultPos   — fallback pos when s.imagePos is not set (default 'corner')
//    defaultSize  — fallback size when s.imageSize is not set
//    alt          — img alt text
//    extraStyle   — extra CSS appended to each <img>
//    iconKey      — icon to show when no image (default: s.icon || 'robot')
//
//  Returns:
//    html       — the image HTML, or the .slide-robot icon deco
//    pos        — effective position ('corner' etc.), or null when icon fallback
//    hasImage   — true if real image(s) were found; false for icon fallback
// ═══════════════════════════════════════════════════════════════
function slideImages(s, opts = {}) {
  const srcs = s.images
    ? s.images
    : s.image
      ? [s.image]
      : [];

  // ── No image → return icon deco ──────────────────────────────
  if (!srcs.length) {
    const key = opts.iconKey || s.icon || 'robot';
    return { html: robotDeco(key), pos: null, hasImage: false };
  }

  // ── Image(s) found → render them ─────────────────────────────
  const pos  = s.imagePos || opts.defaultPos || 'corner';
  const size = s.imageSize || opts.defaultSize || 'clamp(80px,11vw,130px)';
  const alt  = opts.alt || s.heading || '';
  const extra = opts.extraStyle || '';

  const baseStyle = [
    `height:auto`,
    `border-radius:10px`,
    `border:1.5px solid var(--cbb)`,
    `box-shadow:0 0 20px rgba(255,45,107,.32)`,
    `object-fit:cover`,
    `opacity:.9`,
    extra
  ].filter(Boolean).join(';');

  const html = srcs.map(src =>
    `<img src="${src}" alt="${alt}" style="width:${size};${baseStyle}" loading="lazy" />`
  ).join('');

  return { html, pos, hasImage: true };
}

// ═══════════════════════════════════════════════════════════════
//  BUILD ALL SLIDES
//  This function assembles the full deck in order:
//    1. INTRO_SLIDES (word → question → CEO → pillars → etc.)
//    2. Each SECTION: divider + HIT slides + 20 patent slides
//    3. Closing slide
//  Slide numbers are assigned automatically — do not set them manually.
// ═══════════════════════════════════════════════════════════════

// ─── type:'robot-image'  ── robot holding domestic objects ─────────────────
function buildRobotSlide(n, robotIndices) {
  const robots = robotIndices.map(i => ROBOT_ROWS[i]).filter(Boolean);
  if (!robots.length) return '';
  
  // Collect unique patent nums across all these robots
  const patentMap = {};
  robots.forEach(r => {
    r.patents.forEach(p => {
      if (p.num && !patentMap[p.num]) patentMap[p.num] = p;
    });
  });
  const patents = Object.values(patentMap).slice(0, 8);
  
  const label = robots.map(r => r.label).join(' · ');
  const voice = `She patented the machine. Robot image: ${label}. The robots are trained on her work. She held the original patents.`;

  // Build robot image grid
  const imgCols = robots.length === 1 ? '1fr' :
                  robots.length === 2 ? '1fr 1fr' :
                  robots.length <= 4  ? 'repeat(2,1fr)' :
                  robots.length <= 6  ? 'repeat(3,1fr)' : 'repeat(4,1fr)';
  
  const imgGrid = `<div style="display:grid;grid-template-columns:${imgCols};gap:clamp(6px,1vw,12px);width:100%">
    ${robots.map(r => `
      <div style="position:relative;border-radius:10px;overflow:hidden;border:1.5px solid rgba(255,100,160,.25);box-shadow:0 0 18px rgba(255,45,107,.2);aspect-ratio:4/3">
        <img src="${r.img}" alt="${r.label}" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy">
        <div style="position:absolute;bottom:0;left:0;right:0;padding:4px 8px;background:rgba(10,0,6,.75);backdrop-filter:blur(4px)">
          <span style="font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(7px,.75vw,9px);color:var(--candy);letter-spacing:.08em">${r.label}</span>
        </div>
      </div>`).join('')}
  </div>`;

  // Patent list
  const patentList = patents.length ? `
    <div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">
      ${patents.map(p => `
        <div style="display:flex;align-items:baseline;gap:6px;padding:4px 8px;background:rgba(255,45,107,.05);border:1px solid rgba(255,100,160,.1);border-radius:6px;font-size:clamp(7px,.78vw,9px)">
          <a href="${p.link}" target="_blank" rel="noopener" style="font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(6px,.72vw,8.5px);color:var(--hot);text-decoration:none;padding:1px 5px;background:rgba(255,45,107,.12);border:1px solid rgba(255,100,160,.3);border-radius:4px;white-space:nowrap;flex-shrink:0">${p.num}</a>
          <span style="color:var(--cream);flex:1;line-height:1.3">${p.title}</span>
          ${p.inv && p.inv !== 'Inventor unattributed' && p.inv !== '—' && p.inv !== '\u2014' ? `<span style="color:var(--candy);white-space:nowrap">${p.inv}</span>` : ''}
          <span style="color:rgba(255,160,200,.45);white-space:nowrap">${p.date}</span>
        </div>`).join('')}
    </div>` : '';

  const inner = `<div class="sc" style="flex-direction:column;gap:clamp(8px,1.2vh,14px);justify-content:flex-start;padding-top:clamp(8px,1.5vh,14px)">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
    <div style="width:8px;height:8px;border-radius:50%;background:var(--hot);box-shadow:0 0 6px var(--hot);animation:breathe 2s ease-in-out infinite;flex-shrink:0"></div>
    <span style="font-size:clamp(7px,.82vw,9.5px);letter-spacing:.18em;text-transform:uppercase;color:var(--hot);font-family:'Nunito',sans-serif;font-weight:900">✦ She Patented the Machine · Direct Robot</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,20px);flex:1;min-height:0">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h2 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(12px,1.7vw,22px);background:linear-gradient(120deg,var(--cream) 20%,var(--blush) 55%,var(--fuchsia) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2">The robots were trained on her work.</h2>
      <p style="font-size:clamp(8px,.95vw,11px);color:rgba(255,200,224,.75);line-height:1.6;font-style:italic">Many objects held by AI-generated robots were first invented and patented by women. The AI learned the task from data that never credited the original inventors.</p>
      ${imgGrid}
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;overflow:hidden">
      <div style="font-size:clamp(7px,.78vw,9px);letter-spacing:.2em;text-transform:uppercase;color:var(--hot);font-family:'Nunito',sans-serif;font-weight:900;margin-bottom:2px">✦ She held the original patents</div>
      ${patentList}
    </div>
  </div>
</div>`;

  return slideWrap(n, voice, 'robot-image', inner, '', {title:'She Patented the Machine', label:'Direct Robot · ' + label, type:'robot image · women inventors', icon:'domestic'});
}

function buildAll() {
  const slides = [];
  let n = 0;
  function add(html) { n++; slides.push(html.replace(/TOTAL/g,'___TOTAL___')); }

  INTRO_SLIDES.forEach(s => {
    if      (s.type === 'opening-card')  add(buildOpeningCard(n+1, s));
    else if (s.type === 'process-card')  add(buildProcessCard(n+1, s));
    else if (s.type === 'word')          add(buildWordSlide(n+1, s));
    else if (s.type === 'question')      add(buildQuestionSlide(n+1, s));
    else if (s.type === 'ceo-intro')     add(buildCEOIntroSlide(n+1, s));
    else if (s.type === 'title')         add(buildIntroTitle(n+1, s));
    else if (s.type === 'pillars')       add(buildPillarsSlide(n+1, s));
    else if (s.type === 'embrace')       add(buildEmbraceSlide(n+1, s));
    else if (s.type === 'bots-overview') add(buildBotsOverview(n+1, s));
    else if (s.type === 'quote')         add(buildQuoteSlide(n+1, s));
    else if (s.type === 'hit-explainer') {
      add(buildAudienceSlide(n+1, AUDIENCE_SLIDE));
      add(buildHitExplainerSlide(n+1, s));
    }
  });

  SECTIONS.forEach(sec => {
    const pool = sec.patentPool || PATENT_POOL_DEFAULT;
    add(buildSectionDivider(n+1, sec));
    sec.slides.forEach(slide => add(buildTopicSlide(n+1, slide, sec.icon)));
    for (let i = 0; i < pool.length; i++) add(buildPatentSlide(n+1, pool[i]));
    // ── Robot image slide after patents (where robots match this section) ──
    const robotIdxs = SECTION_ROBOTS[sec.patentPool === PATENT_POOL_COMPUTATION ? 'computation'
      : sec.patentPool === PATENT_POOL_CLEANING  ? 'cleaning'
      : sec.patentPool === PATENT_POOL_COOKING   ? 'cooking'
      : sec.patentPool === PATENT_POOL_TEXTILES  ? 'textiles'
      : sec.patentPool === PATENT_POOL_FOOD      ? 'food'
      : sec.patentPool === PATENT_POOL_FURNITURE ? 'furniture'
      : sec.patentPool === PATENT_POOL_HAIR      ? 'hair'
      : sec.patentPool === PATENT_POOL_TOYS_MEDICAL ? 'toys_medical' : ''] || [];
    if (robotIdxs.length) add(buildRobotSlide(n+1, robotIdxs));
    // After COMPUTATION patents: 23 Human Computer slides
    if (sec.patentPool === PATENT_POOL_COMPUTATION) {
      for (let i = 1; i <= 23; i++) {
        const num = String(i).padStart(2,'0');
        add(buildImageGallerySlide(n+1, 'images/humancomputer_' + num + '.png', 'Here are Human Computers'));
      }
    }
    // After CLEANING patents: 40 Woman + Machine slides
    if (sec.patentPool === PATENT_POOL_CLEANING) {
      for (let i = 1; i <= 40; i++) {
        const num = String(i).padStart(2,'0');
        add(buildImageGallerySlide(n+1, 'images/womanmachine_' + num + '.png', 'Here is a Woman Working With a Machine'));
      }
    }
  });

  // ── FINAL CLOSING SLIDE ──────────────────────────────────
  add(buildClosingSlide(n+1));

  const TOTAL = n;
  return slides.join('\n').replace(/___TOTAL___/g, TOTAL);
}

const allHTML = buildAll();
document.getElementById('all-slides').innerHTML = allHTML;

const TOTAL_SLIDES = document.querySelectorAll('.slide').length;
document.getElementById('counter').textContent = `1 / ${TOTAL_SLIDES}`;

// ── DOTS ──
const dotsEl = document.getElementById('dots');
for (let i = 1; i <= TOTAL_SLIDES; i++) {
  const d = document.createElement('div');
  d.className = 'dind' + (i === 1 ? ' on' : '');
  d.title = 'Slide ' + i;
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}

// ── NAVIGATION ──
let cur = 1;

function goTo(n, autoRead) {
  if (n < 1 || n > TOTAL_SLIDES || n === cur) return;
  stopSpeech();
  document.getElementById('s' + cur)?.classList.remove('active');
  cur = n;
  const slide = document.getElementById('s' + cur);
  if (!slide) return;
  slide.classList.add('active');
  document.getElementById('counter').textContent = `${cur} / ${TOTAL_SLIDES}`;
  document.getElementById('prevBtn').disabled = cur === 1;
  document.getElementById('nextBtn').disabled = cur === TOTAL_SLIDES;
  dotsEl.querySelectorAll('.dind').forEach((d, i) => d.classList.toggle('on', i + 1 === cur));
  if (autoRead) setTimeout(() => readSlide(cur), 420);
}

document.getElementById('prevBtn').addEventListener('click', () => goTo(cur - 1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(cur + 1));

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(cur + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(cur - 1);
  if (e.key === ' ') { e.preventDefault(); readSlide(cur); }
  if (e.key === 'f' || e.key === 'F') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  }
});

// ── VOICE ──
const synth = window.speechSynthesis;
let femVoice = null;
function loadVoices() {
  const voices = synth.getVoices();
  if (!voices.length) return;
  const pref = ['Samantha','Victoria','Karen','Moira','Tessa','Google UK English Female','Google US English','Microsoft Zira Desktop','Microsoft Hazel Desktop'];
  for (const nm of pref) { const m = voices.find(v => v.name.includes(nm)); if (m) { femVoice = m; break; } }
  if (!femVoice) femVoice = voices.find(v => v.lang.startsWith('en'));
  document.querySelectorAll('[id^=vs]').forEach(el => { if (femVoice) el.textContent = '🎙 ' + femVoice.name; });
}
synth.addEventListener('voiceschanged', loadVoices);
setTimeout(loadVoices, 100);

function readSlide(n) {
  const slide = document.getElementById('s' + n);
  if (!slide) return;
  const text = slide.getAttribute('data-voice');
  if (!text) return;
  stopSpeech();
  const rate  = parseFloat(document.getElementById('vrate')?.value || '.95');
  const pitch = parseFloat(document.getElementById('vpitch')?.value || '1.1');
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = rate; utt.pitch = pitch; utt.lang = 'en-US';
  if (femVoice) utt.voice = femVoice;
  const btn = document.getElementById('vb' + n);
  const lbl = document.getElementById('vl' + n);
  utt.onstart = () => { if (btn) btn.classList.add('spk'); if (lbl) lbl.textContent = '▐▐ Speaking…'; };
  utt.onend = () => { if (btn) btn.classList.remove('spk'); if (lbl) lbl.textContent = '▶ Read Aloud'; };
  utt.onerror = () => { if (btn) btn.classList.remove('spk'); if (lbl) lbl.textContent = '▶ Read Aloud'; };
  synth.speak(utt);
}

function stopSpeech() {
  synth.cancel();
  document.querySelectorAll('.vbtn.spk').forEach(b => {
    b.classList.remove('spk');
    const lbl = b.querySelector('span:last-child');
    if (lbl) lbl.textContent = '▶ Read Aloud';
  });
}

// ── SPARKLES ──
function mkSparks(id) {
  const wrap = document.getElementById(id);
  if (!wrap) return;
  const chars = ['✦','✧','♡','˚','·','◦','°'];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    s.className = 'sp'; s.textContent = chars[Math.floor(Math.random()*chars.length)];
    s.style.left = Math.random()*100+'%';
    s.style.bottom = Math.random()*-50+'px';
    s.style.fontSize = (7+Math.random()*9)+'px';
    s.style.color = `hsl(${310+Math.random()*50},75%,${65+Math.random()*25}%)`;
    s.style.animationDuration = (8+Math.random()*12)+'s';
    s.style.animationDelay = (Math.random()*12)+'s';
    wrap.appendChild(s);
  }
}
document.querySelectorAll('.sparks').forEach(el => mkSparks(el.id));

// ── SLIDE PICKER ──
const slideIndex = [];
function buildPickerIndex() {
  for (let i = 1; i <= TOTAL_SLIDES; i++) {
    const el = document.getElementById('s' + i);
    if (!el) continue;
    slideIndex.push({
      n: i,
      title:   el.getAttribute('data-pick-title') || 'Slide ' + i,
      label:   el.getAttribute('data-pick-label') || '',
      type:    el.getAttribute('data-pick-type')  || '',
      iconKey: el.getAttribute('data-pick-icon')  || 'robot'
    });
  }
}

function renderPickerGrid(filter) {
  const grid = document.getElementById('pickerGrid');
  const q = (filter||'').toLowerCase().trim();
  grid.innerHTML = '';
  let lastType = null, matchCount = 0;
  slideIndex.forEach(s => {
    const ok = !q || s.title.toLowerCase().includes(q) || s.label.toLowerCase().includes(q) || String(s.n).includes(q) || s.type.toLowerCase().includes(q);
    if (!ok) return;
    matchCount++;
    if (!q && s.type !== lastType) {
      const hdr = document.createElement('div');
      hdr.className = 'picker-section-hdr';
      hdr.textContent = s.type || 'slides';
      grid.appendChild(hdr);
      lastType = s.type;
    }
    const row = document.createElement('div');
    row.className = 'picker-row' + (s.n === cur ? ' current' : '');
    row.innerHTML = `<span class="pr-num">${s.n}</span><span class="pr-icon">${ICONS[s.iconKey]||ICONS.robot}</span><span class="pr-text"><span class="pr-title">${s.title}</span>${s.label?`<span class="pr-label">${s.label}</span>`:''}</span>${s.n===cur?'<span class="pr-cur"></span>':''}`;
    row.addEventListener('click', () => { goTo(s.n); closePicker(); });
    grid.appendChild(row);
  });
  if (!matchCount) grid.innerHTML = `<div style="text-align:center;color:var(--dim);padding:40px 20px;font-size:13px">No slides match "<strong style="color:var(--candy)">${filter}</strong>"</div>`;
}

function openPicker() {
  if (!slideIndex.length) buildPickerIndex();
  renderPickerGrid('');
  document.getElementById('pickerOverlay').classList.add('open');
  setTimeout(() => document.getElementById('pickerSearch').focus(), 80);
}
function closePicker() {
  document.getElementById('pickerOverlay').classList.remove('open');
  document.getElementById('pickerSearch').value = '';
}
function filterPicker(val) { renderPickerGrid(val); }

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'g' || e.key === 'G') { e.preventDefault(); openPicker(); }
  if (e.key === 'Escape') closePicker();
});
</script>
