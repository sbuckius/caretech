.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,160,200,.2);pointer-events:none;white-space:nowrap;z-index:20;}

.btn{font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;letter-spacing:.10em;text-transform:uppercase;text-decoration:none;padding:10px 28px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;}

function addM(g,geo,mat,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);g.add(m);return m;}

function mk(c,ei=0){const m=new THREE.MeshLambertMaterial({color:c});if(ei>0){m.emissive=new THREE.Color(c);m.emissiveIntensity=ei;}return m;}

    addM(g,cy(0.11,0.11,0.18,8),hair,0,1.58,0);
    const pt=addM(g,cy(0.08,0.04,0.52,7),hair,0.10,1.86,0);pt.rotation.z=0.38;
    addM(g,sp2(0.10,7,7),hair,0.22,2.14,0);
    addM(g,new THREE.TorusGeometry(0.12,0.038,6,12),mk(0xff2d6b,0.8),0,1.58,0);
    eyePair(g,1.06,0.24);mouthBar(g,0.88,0.24,0.20);addM(g,bx(0.52,0.58,0.40),bm,0,0.54,0);

    addM(g,bx(0.18,0.44,0.18),bm,-0.48,0.54,0,0,0,0.38);addM(g,bx(0.18,0.44,0.18),bm,0.48,0.54,0,0,0,-0.38);

  }else if(type===3){

    addM(g,bx(0.66,0.54,0.50),hm,0,1.0,0);addM(g,bx(0.76,0.16,0.58),hair,0,1.42,0);

    eyePair(g,1.08,0.35);mouthBar(g,0.90,0.34);addM(g,bx(0.48,0.66,0.37),bm,0,0.52,0);
    addM(g,bx(0.30,0.24,0.055),mk(0xff2d6b,0.14),0,0.54,0.21);
    addM(g,bx(0.16,0.52,0.16),bm,-0.36,0.50,0);addM(g,bx(0.16,0.52,0.16),bm,0.36,0.50,0);
    addM(g,bx(0.16,0.40,0.16),bm,-0.14,0.14,0);addM(g,bx(0.16,0.40,0.16),bm,0.14,0.14,0);
  }else if(type===7){

    eyePair(g,1.02,0.35);mouthBar(g,0.84,0.34);addM(g,bx(0.70,0.50,0.42),bm,0,0.54,0);

}

addM(tileGroup,bx(TW,0.07,TD),capMat,0,TH+0.035,0);

// Canvas label texture
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function wrapText(ctx,text,maxW){const words=text.split(' ');const lines=[];let cur='';words.forEach(w=>{const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else{cur=test;}});if(cur)lines.push(cur);return lines;}

const cw=512,ch=256,cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
const ctx=cv.getContext('2d');
ctx.clearRect(0,0,cw,ch);ctx.fillStyle='rgba(8,0,5,0.82)';roundRect(ctx,0,0,cw,ch,18);ctx.fill();
const col=new THREE.Color(TILE_COLOR),hex='#'+col.getHexString();
const grd=ctx.createLinearGradient(0,0,cw,0);
grd.addColorStop(0,'transparent');grd.addColorStop(0.35,hex);grd.addColorStop(0.5,'#ff85b3');grd.addColorStop(0.65,hex);grd.addColorStop(1,'transparent');
ctx.strokeStyle=grd;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(60,2);ctx.lineTo(cw-60,2);ctx.stroke();
ctx.font='bold 20px "Nunito",sans-serif';ctx.fillStyle=hex;ctx.globalAlpha=0.85;ctx.textAlign='center';
ctx.fillText('CAREBOT-'+BOT_NUM,cw/2,34);ctx.globalAlpha=1.0;
ctx.font='900 28px "Nunito",sans-serif';ctx.fillStyle='#fff5f8';
const tLines=wrapText(ctx,BOT_TITLE,cw-40);let ty=tLines.length>1?66:76;
tLines.forEach(l=>{ctx.fillText(l,cw/2,ty);ty+=32;});
ctx.font='italic 19px "Quicksand",sans-serif';ctx.fillStyle='rgba(255,190,220,0.72)';
const iLines=wrapText(ctx,BOT_IRONY,cw-50);let iy=Math.min(ty+6,ch-70);
iLines.slice(0,2).forEach(l=>{ctx.fillText(l,cw/2,iy);iy+=24;});
// Buttons drawn on canvas (decorative — real buttons are in HTML)
function drawBtn(ctx,x,y,w,h,bg1,bg2,tc,lbl,bc){
  const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,bg1);g.addColorStop(1,bg2);
  ctx.fillStyle=g;roundRect(ctx,x,y,w,h,9);ctx.fill();
  ctx.strokeStyle=bc||'rgba(255,100,150,0.9)';ctx.lineWidth=2.5;roundRect(ctx,x,y,w,h,9);ctx.stroke();
  ctx.font='900 20px "Nunito",sans-serif';ctx.fillStyle=tc;ctx.textAlign='center';ctx.fillText(lbl,x+w/2,y+h/2+7);
}
drawBtn(ctx,52,ch-46,172,36,'#ff2d6b','#c4005a','#fff5f8','HIT ↗');
drawBtn(ctx,240,ch-46,172,36,'rgba(255,45,107,0.18)','rgba(255,45,107,0.18)','#ffb3cf','BOT ↗',hex);

const labelPlane=new THREE.Mesh(
  new THREE.PlaneGeometry(TW-0.1,TD-0.1),
  new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false,depthTest:false})
);
labelPlane.rotation.x=-Math.PI/2;labelPlane.position.y=TH+0.12;labelPlane.renderOrder=0;
tileGroup.add(labelPlane);

// ── BOT ──
const botShape=buildBot(BOT_TYPE,col);
botShape.scale.setScalar(0.82);
botShape.position.set(0,TH+0.02,0);
botScene.add(botShape);

const botLight=new THREE.PointLight(0xff2d6b,4.0,15);
botLight.position.set(0,2,-3);
botScene.add(botLight);

// ── ORBIT ──
let isDragging=false,prevMouse={x:0,y:0};
let spherical={theta:0.20,phi:0.72,radius:isMobile?7:8};
let prevPinchDist=0;

canvas.addEventListener('mousedown',e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup',()=>{isDragging=false;});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  spherical.theta-=(e.clientX-prevMouse.x)*0.007;
  spherical.phi=Math.max(0.18,Math.min(1.3,spherical.phi+(e.clientY-prevMouse.y)*0.006));
  prevMouse={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('wheel',e=>{e.preventDefault();spherical.radius=Math.max(4,Math.min(20,spherical.radius+e.deltaY*0.03));},{passive:false});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===1){isDragging=true;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};}else if(e.touches.length===2){isDragging=false;const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;prevPinchDist=Math.sqrt(dx*dx+dy*dy);}},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(e.touches.length===0)isDragging=false;},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&isDragging){spherical.theta-=(e.touches[0].clientX-prevMouse.x)*0.007;spherical.phi=Math.max(0.18,Math.min(1.3,spherical.phi+(e.touches[0].clientY-prevMouse.y)*0.006));prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};}
  else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dist=Math.sqrt(dx*dx+dy*dy);if(prevPinchDist>0)spherical.radius=Math.max(4,Math.min(20,spherical.radius-(dist-prevPinchDist)*0.04));prevPinchDist=dist;}
},{passive:false});

// ── ANIMATE ──
let t=0;
const xFreq=0.28+(BOT_IDX%7)*0.07, zFreq=0.21+(BOT_IDX%5)*0.09;
const xPh=(BOT_IDX*2.39)%(Math.PI*2), zPh=(BOT_IDX*1.73)%(Math.PI*2);
const halfX=TW/2*0.68, halfZ=TD/2*0.68;
const wobSpd=0.9+(BOT_IDX%9)*0.18, bobAmp=0.04+(BOT_IDX%8)*0.015;

function animate(){
  requestAnimationFrame(animate); t+=0.016;
  const cx=spherical.radius*Math.sin(spherical.phi)*Math.sin(spherical.theta);
  const cy=spherical.radius*Math.cos(spherical.phi);
  const cz=spherical.radius*Math.sin(spherical.phi)*Math.cos(spherical.theta);
  camera.position.set(cx,cy+1.2,cz); camera.lookAt(0,1,0);

  // Tile float
  tileGroup.position.y=Math.sin(t*1.1)*0.06;

  // Bot roam
  const rx=Math.sin(t*xFreq+xPh)*halfX, rz=Math.cos(t*zFreq+zPh)*halfZ;
  botShape.position.x=rx; botShape.position.z=rz;
  botShape.position.y=tileGroup.position.y+TH+0.02+Math.abs(Math.sin(t*wobSpd*2))*bobAmp;
  const dx=Math.cos(t*xFreq+xPh)*halfX*xFreq, dz=-Math.sin(t*zFreq+zPh)*halfZ*zFreq;
  if(Math.abs(dx)+Math.abs(dz)>0.001) botShape.rotation.y=Math.atan2(dx,dz);

  // Personality wobble
  const bt=BOT_TYPE;
  if(bt===0){const b=Math.abs(Math.sin(t*3.2));botShape.scale.y=0.82+b*0.18;botShape.scale.x=1+b*0.06;botShape.scale.z=1+b*0.06;botShape.rotation.z=Math.sin(t*3.2)*0.12;}
  else if(bt===1){botShape.rotation.x=Math.sin(t*9.5)*0.06;botShape.rotation.z=Math.sin(t*7.3)*0.05;botShape.scale.setScalar(1+Math.sin(t*4)*0.04);}
  else if(bt===2){botShape.rotation.y+=0.04;botShape.scale.y=1+Math.sin(t*4)*0.08;}
  else if(bt===3){botShape.rotation.z=Math.sin(t*xFreq+xPh)*0.30;}
  else if(bt===5){botShape.rotation.z=Math.sin(t*4.5)*0.22;botShape.scale.x=1+Math.sin(t*4.5)*0.05;}
  else if(bt===6){botShape.rotation.x=Math.sin(t*1.2)*0.12;botShape.scale.y=1+Math.sin(t*2.4)*0.05;}
  else if(bt===7){botShape.rotation.x=Math.sin(t*5.5)*0.28;botShape.scale.y=1-Math.abs(Math.sin(t*5.5))*0.10;}
  else if(bt===8){botShape.scale.setScalar(1+Math.sin(t*1.4)*0.09);}
  else if(bt===9){const hop=Math.max(0,Math.sin(t*4.0));botShape.position.y+=hop*hop*0.22;botShape.scale.y=1-hop*0.10;botShape.scale.x=1+hop*0.06;}

  // Bot light follows bot
  botLight.position.set(botShape.position.x,botShape.position.y+1.5,-2);

  renderer.autoClear=true; renderer.render(scene,camera);
  renderer.autoClear=false; renderer.render(botScene,camera); renderer.autoClear=true;
}
animate();
</script>
</body>
</html>
